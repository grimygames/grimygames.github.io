<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sketchy Stomp</title>
    <!-- Google Font: Raleway (Regular, Bold, Black) -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Raleway', sans-serif;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Raleway', sans-serif;
            overflow: hidden;
        }
        #game-container {
            width: 300px;
            height: 250px;
            position: relative;
            border: 2px solid #000000;
            box-sizing: content-box;
            transition: border-color 0.3s ease;
            touch-action: none;
        }
        #game-container:hover {
            border-color: #000000;
        }
        #game-container canvas {
            display: block;
            touch-action: none;
        }
        .font-preload {
            font-family: 'Raleway', sans-serif;
            font-weight: 900;
            position: absolute;
            left: -9999px;
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="font-preload">.</div>
<div id="game-container" oncontextmenu="return false;"></div>

<script>

        bootRestX: 150,

// CounterAPI for Global World Stomps
const GLOBAL_API_NAMESPACE = 'grimygames';
const GLOBAL_API_KEY = 'stomps';
const WORLD_SCORE_OFFSET = 0;

// ============================================================================
// 2. CROSS-BROWSER ASSET PRELOADER
// ============================================================================
const LOADED_HTML_IMAGES = {};
const LOADED_HTML_AUDIO = {};

function preloadLocalAssets(onReady) {
    const allImageEntries = [
        ...Object.entries(ASSETS_CONFIG.images),
        ...ASSETS_CONFIG.cans.map(c => [c.key, c.path]),
        ...ASSETS_CONFIG.cans.map(c => [c.crushedKey, c.crushedPath]),
        ...ASSETS_CONFIG.hazards.map(h => [h.key, h.path])
    ];
    let remaining = allImageEntries.length;

    Object.entries(ASSETS_CONFIG.audio).forEach(([key, path]) => {
        if (!path) return;
        const cleanPath = path.replace(/\\/g, '/');
        const audio = new Audio();
        audio.src = cleanPath;
        audio.preload = 'auto';
        audio.addEventListener('canplaythrough', () => {
            LOADED_HTML_AUDIO[key] = audio;
        }, { once: true });
        audio.addEventListener('error', () => {}, { once: true });
    });

    const startWhenFontReady = () => {
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => onReady()).catch(() => onReady());
        } else {
            onReady();
        }
    };

    if (remaining === 0) {
        startWhenFontReady();
        return;
    }

    const checkDone = () => {
        remaining--;
        if (remaining <= 0) startWhenFontReady();
    };

    allImageEntries.forEach(([key, path]) => {
        if (!path) {
            checkDone();
            return;
        }
        const cleanPath = path.replace(/\\/g, '/');
        const img = new Image();
        img.onload = () => {
            LOADED_HTML_IMAGES[key] = img;
            checkDone();
        };
        img.onerror = () => {
            checkDone();
        };
        img.src = cleanPath;
    });
}

// ============================================================================
// 3. MAIN PHASER GAME SCENE
// ============================================================================
class StompGame extends Phaser.Scene {
    constructor() {
        super('StompGame');
        this.playerScore = 0;
        this.highScore = parseInt(localStorage.getItem('grimy_stomp_high')) || 0;
        this.bestStreak = parseInt(localStorage.getItem('grimy_stomp_streak')) || 0;
        this.worldScore = 0;

        this.gameState = 'TITLE'; // 'TITLE' or 'PLAYING'
        this.roundTimeRemaining = ASSETS_CONFIG.gameplay.roundDuration;
        this.lastWholeSecond = 30;

        this.currentStreak = 0;
        this.isMuted = localStorage.getItem('grimy_stomp_muted') === 'true';
        this.isBootCurrentlyBloody = false;

        this.canInteract = false;
        this.isModalOpen = false;
        this.isResetConfirming = false;

        this.currentItem = null;
        this.itemTimeRemaining = 0;
        this.itemTotalTime = 500;
    }

    create() {
        Object.entries(LOADED_HTML_IMAGES).forEach(([key, imgElement]) => {
            if (!this.textures.exists(key)) {
                this.textures.addImage(key, imgElement);
            }
        });

        this.createFallbackTextures();
        this.fetchWorldScore();

        const m = ASSETS_CONFIG.metrics;

        // 1. Background Art + Curb Blood Stain Layer
        this.add.image(150, 125, 'background').setDisplaySize(300, 250).setDepth(0);
        this.curbStainGraphics = this.add.graphics().setDepth(2);

        // 2. TOP HUD (Credits on Left, Menu on Right)
        this.creditsBtn = this.add.image(m.creditsBtnX, m.topHudY, 'creditsBtn')
            .setDisplaySize(48, 16)
            .setInteractive({ useHandCursor: true })
            .setDepth(65);

        this.creditsBtn.on('pointerdown', (pointer, localX, localY, event) => {
            event.stopPropagation();
            this.unlockWebAudio();
            this.openCredits();
        });

        // Exit button placed under credits button
        this.exitBtn = this.add.image(m.exitBtnX, m.exitBtnY, 'exitBtn')
            .setDisplaySize(m.exitBtnWidth, m.exitBtnHeight)
            .setInteractive({ useHandCursor: true })
            .setDepth(65)
            .setVisible(false);

        this.exitBtn.on('pointerdown', (pointer, localX, localY, event) => {
            event.stopPropagation();
            this.playSound('menuClick');
            this.exitToTitle();
        });

        this.menuBtn = this.add.image(m.menuBtnX, m.topHudY, 'menuBtn')
            .setDisplaySize(22, 22)
            .setInteractive({ useHandCursor: true })
            .setDepth(65);

        this.menuBtn.on('pointerdown', (pointer, localX, localY, event) => {
            event.stopPropagation();
            this.unlockWebAudio();
            this.openOptionsMenu();
        });

        // 30.0s Timer placed directly under menu button on the right
        this.roundTimerText = this.add.text(285, m.roundTimerY, '30.0s', {
            fontFamily: ASSETS_CONFIG.fontFamily,
            fontSize: '12px',
            color: '#ffffff',
            stroke: '#000000',
            strokeThickness: 3,
            fontStyle: '900'
        }).setOrigin(1, 0.5).setDepth(65).setVisible(false);

        // 3. BOTTOM CENTERED HUD (Player Score & World Score with icons)
        this.add.image(m.playerIconX, m.bottomHudY, 'playerIcon').setDisplaySize(16, 16).setDepth(65);
        this.playerScoreText = this.add.text(m.playerScoreX, m.bottomHudY, `${this.playerScore}`, {
            fontFamily: ASSETS_CONFIG.fontFamily,
            fontSize: '14px',
            color: '#ffffff',
            stroke: '#000000',
            strokeThickness: 3,
            fontStyle: '900'
        }).setOrigin(0, 0.5).setDepth(65);

        this.add.image(m.worldIconX, m.bottomHudY, 'worldIcon').setDisplaySize(16, 16).setDepth(65);
        this.worldScoreText = this.add.text(m.worldScoreX, m.bottomHudY, `...`, {
            fontFamily: ASSETS_CONFIG.fontFamily,
            fontSize: '14px',
            color: '#ffffff',
            stroke: '#000000',
            strokeThickness: 3,
            fontStyle: '900'
        }).setOrigin(0, 0.5).setDepth(65);

        // Feed text (Status Alert Text) placed just above the score
        this.statusText = this.add.text(150, m.alertStatusY, '', {
            fontFamily: ASSETS_CONFIG.fontFamily,
            fontSize: '11.5px',
            color: '#00ffcc',
            stroke: '#000000',
            strokeThickness: 3,
            fontStyle: '900'
        }).setOrigin(0.5).setDepth(26);

        // 4. Timer Bar Image GameObjects (Round & Item Timers)
        this.roundTimerBgImg = this.add.image(m.roundTimerBarX, m.roundTimerBarY, 'roundTimerBg').setDisplaySize(300, 5).setDepth(21).setVisible(false);
        this.roundTimerFillImg = this.add.image(2, m.roundTimerBarY, 'roundTimerFill').setDisplaySize(296, 3).setOrigin(0, 0.5).setDepth(22).setVisible(false);

        this.itemTimerBgImg = this.add.image(m.itemTimerBarX, m.itemTimerBarY, 'itemTimerBg').setDisplaySize(88, 8).setDepth(14).setVisible(false);
        this.itemTimerFillImg = this.add.image(m.itemTimerBarX - 42, m.itemTimerBarY, 'itemTimerFill').setDisplaySize(84, 4).setOrigin(0, 0.5).setDepth(15).setVisible(false);

        this.shockwaveGraphics = this.add.graphics().setDepth(9);
        this.activeShockwaves = [];
        this.floatingTexts = [];

        // 5. Top Stomping Boot
        this.boot = this.add.image(m.bootRestX, m.bootRestY, 'stompBoot')
            .setOrigin(0.5, 1)
            .setDisplaySize(m.bootWidth, m.bootHeight)
            .setDepth(12);

        // 6. Blood Drop Particles Array
        this.bloodDrops = [];

        // 7. Build Title Screen, Credits Modal & Options Modal
        this.buildTitleScreen();
        this.buildCreditsModal();
        this.buildOptionsMenuModal();

        // 8. Poll Global Server Score every 10s
        this.time.addEvent({
            delay: 10000,
            callback: this.fetchWorldScore,
            callbackScope: this,
            loop: true
        });

        // 9. Input Listeners
        this.input.on('pointerdown', (pointer, currentlyOver) => {
            this.unlockWebAudio();
            if (this.isModalOpen || this.gameState !== 'PLAYING') return;
            if (
                currentlyOver.includes(this.menuBtn) ||
                currentlyOver.includes(this.creditsBtn) ||
                currentlyOver.includes(this.exitBtn)
            ) {
                return;
            }
            this.triggerStomp();
        });

        this.input.keyboard.on('keydown-SPACE', () => {
            this.unlockWebAudio();
            if (this.isModalOpen) return;
            if (this.gameState === 'TITLE') {
                this.playSound('menuClick');
                this.startRound();
            } else if (this.gameState === 'PLAYING') {
                this.triggerStomp();
            }
        });

        this.input.keyboard.on('keydown-ESC', () => {
            if (this.isModalOpen) {
                if (this.menuModal.visible) this.closeOptionsMenu();
                if (this.creditsModal.visible) this.closeCredits();
                return;
            }
            if (this.gameState === 'PLAYING') {
                this.playSound('menuClick');
                this.exitToTitle();
            }
        });

        this.showTitleScreen(false);
    }

    unlockWebAudio() {
        try {
            if (this.sound && this.sound.context && this.sound.context.state === 'suspended') {
                this.sound.context.resume();
            }
        } catch (e) {}
    }

    buildTitleScreen() {
        const font = ASSETS_CONFIG.fontFamily;
        const hs = ASSETS_CONFIG.highScoreStyle;

        this.titleContainer = this.add.container(0, 0).setDepth(60);

        const dimBg = this.add.rectangle(
            150,
            125,
            hs.startMatteWidth || 300,
            hs.startMatteHeight || 250,
            hs.startMatteColor,
            hs.startMatteAlpha
        ).setInteractive();

        const titleLogo = this.add.image(150, 78, 'titleLogo').setDisplaySize(184, 50);

        this.titleResultText = this.add.text(150, 116, '30-SECOND CAN CRUSH BLITZ', {
            fontFamily: font,
            fontSize: '10.5px',
            color: '#00ffcc',
            fontStyle: '900'
        }).setOrigin(0.5);

        this.titleScoreBadge = this.add.rectangle(150, 146, 216, 28, hs.bgColor, hs.bgAlpha)
            .setStrokeStyle(hs.borderWidth, hs.borderColor);

        this.titleHighScoreText = this.add.text(150, 146, '', {
            fontFamily: font,
            fontSize: '11px',
            color: hs.fontColor,
            fontStyle: '900'
        }).setOrigin(0.5);

        this.playBtn = this.add.image(150, 192, 'playBtn')
            .setDisplaySize(104, 30)
            .setInteractive({ useHandCursor: true });

        this.playBtn.on('pointerdown', (p, lx, ly, ev) => {
            ev.stopPropagation();
            this.unlockWebAudio();
            this.playSound('menuClick');
            this.startRound();
        });

        this.titleContainer.add([
            dimBg,
            titleLogo,
            this.titleResultText,
            this.titleScoreBadge,
            this.titleHighScoreText,
            this.playBtn
        ]);
    }

    cleanupActiveRoundObjects() {
        this.canInteract = false;
        this.roundTimerBgImg.setVisible(false);
        this.roundTimerFillImg.setVisible(false);
        this.itemTimerBgImg.setVisible(false);
        this.itemTimerFillImg.setVisible(false);

        this.shockwaveGraphics.clear();
        this.activeShockwaves = [];

        this.floatingTexts.forEach(ft => ft.txt.destroy());
        this.floatingTexts = [];

        this.bloodDrops.forEach(b => b.sprite.destroy());
        this.bloodDrops = [];

        if (this.targetSprite) {
            this.tweens.killTweensOf(this.targetSprite);
            this.targetSprite.destroy();
            this.targetSprite = null;
        }

        const m = ASSETS_CONFIG.metrics;
        this.tweens.killTweensOf(this.boot);
        this.boot
            .setPosition(m.bootRestX, m.bootRestY)
            .setDisplaySize(m.bootWidth, m.bootHeight)
            .setAngle(0);
    }

    exitToTitle() {
        this.cleanupActiveRoundObjects();
        this.statusText.setText('');
        this.showTitleScreen(false);
    }

    showTitleScreen(fromRoundEnd = false, isNewBest = false) {
        this.gameState = 'TITLE';
        this.cleanupActiveRoundObjects();
        this.roundTimerText.setVisible(false);
        this.exitBtn.setVisible(false);

        const t = ASSETS_CONFIG.text;
        const hs = ASSETS_CONFIG.highScoreStyle;
        if (fromRoundEnd) {
            if (isNewBest) {
                this.titleResultText.setText(`${t.newRecordHeader}${this.playerScore} CANS!`).setColor('#00ffcc');
            } else {
                this.titleResultText.setText(`${t.timesUpHeader}${this.playerScore} CANS`).setColor('#ff0055');
            }
        } else {
            this.titleResultText.setText('FUCK YEAH!').setColor('#fff');
        }

        this.titleScoreBadge.setFillStyle(hs.bgColor, hs.bgAlpha).setStrokeStyle(hs.borderWidth, hs.borderColor);
        this.titleHighScoreText
            .setText(`${t.titleHighScorePrefix}${this.highScore}   |   ${t.titleBestStreakPrefix}${this.bestStreak}`)
            .setColor(hs.fontColor);

        this.titleContainer.setVisible(true);
    }

    startRound() {
        const g = ASSETS_CONFIG.gameplay;
        const m = ASSETS_CONFIG.metrics;

        this.cleanupActiveRoundObjects();
        this.curbStainGraphics.clear();

        this.gameState = 'PLAYING';
        this.titleContainer.setVisible(false);
        this.exitBtn.setVisible(true);

        this.playerScore = 0;
        this.currentStreak = 0;
        this.playerScoreText.setText('0').setColor('#ffffff').setScale(1);
        this.statusText.setText('');

        this.roundTimeRemaining = g.roundDuration || 30000;
        this.lastWholeSecond = Math.ceil(this.roundTimeRemaining / 1000);
        this.roundTimerText.setVisible(true).setColor('#ffffff');
        this.roundTimerBgImg.setVisible(true);
        this.roundTimerFillImg.setVisible(true);

        this.isBootCurrentlyBloody = false;
        this.boot.setTexture('stompBoot').setDisplaySize(m.bootWidth, m.bootHeight);

        this.spawnNextItem(true);
    }

    endRound() {
        this.gameState = 'TITLE';
        this.playSound('roundOver');
        this.cameras.main.shake(150, 0.013);

        let isNewBest = false;
        if (this.playerScore > this.highScore) {
            this.highScore = this.playerScore;
            isNewBest = true;
        }
        this.saveLocalScores();
        this.showTitleScreen(true, isNewBest);
    }

    showAlert(message, colorHex = '#00ffcc') {
        this.statusText.setText(message).setColor(colorHex);
        if (this.alertClearEvent) this.alertClearEvent.remove(false);
        this.alertClearEvent = this.time.delayedCall(600, () => {
            this.statusText.setText('');
        });
    }

    spawnFloatingText(x, y, textStr, colorHex = '#00ffcc', fontSize = '13px') {
        const txt = this.add.text(x, y, textStr, {
            fontFamily: ASSETS_CONFIG.fontFamily,
            fontSize: fontSize,
            color: colorHex,
            stroke: '#000000',
            strokeThickness: 3,
            fontStyle: '900'
        }).setOrigin(0.5).setDepth(24);

        this.floatingTexts.push({ txt, life: 480, maxLife: 480 });
    }

    spawnImpactShockwave(x, y, colorHex = 0x00ffcc) {
        this.activeShockwaves.push({
            x,
            y,
            radius: 8,
            maxRadius: 38,
            alpha: 0.95,
            color: colorHex
        });
    }

    spawnNextItem(slideIn = true) {
        if (this.gameState !== 'PLAYING') return;

        const g = ASSETS_CONFIG.gameplay;
        const m = ASSETS_CONFIG.metrics;

        if (this.targetSprite) {
            this.tweens.killTweensOf(this.targetSprite);
            this.targetSprite.destroy();
            this.targetSprite = null;
        }

        if (this.isBootCurrentlyBloody) {
            this.isBootCurrentlyBloody = false;
            this.boot.setTexture('stompBoot').setDisplaySize(m.bootWidth, m.bootHeight);
        }

        const isHazard = Math.random() < g.hazardSpawnChance;

        if (isHazard) {
            const hazardCfg = Phaser.Utils.Array.GetRandom(ASSETS_CONFIG.hazards);
            this.currentItem = { type: 'hazard', cfg: hazardCfg };
            this.itemTotalTime = g.hazardStayDuration || 700;
            this.targetSprite = this.add.image(slideIn ? 340 : m.targetX, m.curbY, hazardCfg.key)
                .setDisplaySize(m.hazardWidth, m.hazardHeight)
                .setDepth(8);
        } else {
            const canCfg = Phaser.Utils.Array.GetRandom(ASSETS_CONFIG.cans);
            this.currentItem = { type: 'can', cfg: canCfg };
            this.itemTotalTime = g.canStayDuration || 500;
            this.targetSprite = this.add.image(slideIn ? 340 : m.targetX, m.curbY, canCfg.key)
                .setDisplaySize(m.canWidth, m.canHeight)
                .setDepth(8);
        }

        this.itemTimeRemaining = this.itemTotalTime;
        this.itemTimerBgImg.setVisible(true);
        this.itemTimerFillImg.setVisible(true);

        if (slideIn) {
            this.playSound(isHazard ? 'hazardSlide' : 'canSlide');
            this.tweens.add({
                targets: this.targetSprite,
                x: m.targetX,
                duration: g.slideInDuration || 105,
                ease: 'Quad.easeOut',
                onComplete: () => {
                    if (this.gameState === 'PLAYING') {
                        this.canInteract = true;
                    }
                }
            });
        } else {
            this.canInteract = true;
        }
    }

    update(time, delta) {
        const safeDelta = Math.min(delta, 50);
        const dt = safeDelta / 1000;

        for (let i = this.bloodDrops.length - 1; i >= 0; i--) {
            const b = this.bloodDrops[i];
            b.sprite.x += b.vx * dt;
            b.sprite.y += b.vy * dt;
            b.vy += 520 * dt;
            b.sprite.rotation = Math.atan2(b.vy, b.vx) - Math.PI / 2;
            b.life -= safeDelta;
            b.sprite.setAlpha(Phaser.Math.Clamp(b.life / 200, 0, 1));
            if (b.life <= 0) {
                b.sprite.destroy();
                this.bloodDrops.splice(i, 1);
            }
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.txt.y -= 36 * dt;
            ft.life -= safeDelta;
            ft.txt.setAlpha(Phaser.Math.Clamp(ft.life / ft.maxLife, 0, 1));
            if (ft.life <= 0) {
                ft.txt.destroy();
                this.floatingTexts.splice(i, 1);
            }
        }

        this.shockwaveGraphics.clear();
        for (let i = this.activeShockwaves.length - 1; i >= 0; i--) {
            const sw = this.activeShockwaves[i];
            sw.radius += 140 * dt;
            sw.alpha -= 3.2 * dt;
            if (sw.alpha <= 0) {
                this.activeShockwaves.splice(i, 1);
                continue;
            }
            this.shockwaveGraphics.lineStyle(2, sw.color, sw.alpha);
            this.shockwaveGraphics.strokeEllipse(sw.x, sw.y, sw.radius * 2, sw.radius * 0.75);
        }

        if (this.gameState !== 'PLAYING' || this.isModalOpen) {
            return;
        }

        this.roundTimeRemaining = Math.max(0, this.roundTimeRemaining - safeDelta);
        const secLeft = this.roundTimeRemaining / 1000;
        this.roundTimerText.setText(`${secLeft.toFixed(1)}s`);

        const wholeSec = Math.ceil(secLeft);
        if (wholeSec <= 5 && wholeSec > 0 && wholeSec !== this.lastWholeSecond) {
            this.lastWholeSecond = wholeSec;
            this.playSound('timerTick');
            this.roundTimerText.setColor('#ff0055');
        } else if (wholeSec > 5) {
            this.roundTimerText.setColor('#ffffff');
        }

        const roundPct = Phaser.Math.Clamp(this.roundTimeRemaining / ASSETS_CONFIG.gameplay.roundDuration, 0, 1);
        this.roundTimerFillImg.setDisplaySize(296 * roundPct, 3);

        if (this.roundTimeRemaining <= 0) {
            this.endRound();
            return;
        }

        if (!this.canInteract || !this.currentItem) {
            this.itemTimerBgImg.setVisible(false);
            this.itemTimerFillImg.setVisible(false);
            return;
        }

        this.itemTimeRemaining -= safeDelta;
        const pct = Phaser.Math.Clamp(this.itemTimeRemaining / this.itemTotalTime, 0, 1);

        this.itemTimerBgImg.setVisible(true);
        this.itemTimerFillImg.setVisible(true);
        this.itemTimerFillImg.setDisplaySize(84 * pct, 4);

        if (this.itemTimeRemaining <= 0) {
            this.handleTimerExpiredSlideAway();
        }
    }

    handleTimerExpiredSlideAway() {
        this.canInteract = false;
        this.itemTimerBgImg.setVisible(false);
        this.itemTimerFillImg.setVisible(false);
        const g = ASSETS_CONFIG.gameplay;

        const isHazard = this.currentItem && this.currentItem.type === 'hazard';
        if (!isHazard) {
            this.currentStreak = 0;
            this.playerScoreText.setColor('#ffffff');
        }

        this.playSound(isHazard ? 'hazardSlide' : 'canSlide');
        this.tweens.add({
            targets: this.targetSprite,
            x: -60,
            duration: g.slideOutDuration || 105,
            ease: 'Quad.easeIn',
            onComplete: () => {
                this.spawnNextItem(true);
            }
        });
    }

    triggerStomp() {
        if (!this.canInteract || this.isModalOpen || this.gameState !== 'PLAYING') return;
        this.canInteract = false;
        this.itemTimerBgImg.setVisible(false);
        this.itemTimerFillImg.setVisible(false);
        this.playSound('bootWhoosh');

        const m = ASSETS_CONFIG.metrics;

        this.tweens.killTweensOf(this.boot);
        this.boot.setDisplaySize(m.bootWidth, m.bootHeight).setAngle(0);

        this.tweens.add({
            targets: this.boot,
            y: m.bootSlamY,
            duration: 60,
            ease: 'Quad.easeIn',
            onComplete: () => {
                this.boot.setDisplaySize(m.bootWidth * 1.12, m.bootHeight * 0.96);

                if (this.currentItem.type === 'can') {
                    this.handleCanCrushed();
                } else {
                    this.handleHazardImpaled();
                }
            }
        });
    }

    handleCanCrushed() {
        const m = ASSETS_CONFIG.metrics;
        const g = ASSETS_CONFIG.gameplay;
        const t = ASSETS_CONFIG.text;
        const canCfg = this.currentItem.cfg;

        this.playSound('crushWin');
        this.cameras.main.shake(85, 0.011);

        const crushedTexKey = this.textures.exists(canCfg.crushedKey) ? canCfg.crushedKey : 'defaultCrushedCan';
        this.targetSprite
            .setTexture(crushedTexKey)
            .setDisplaySize(m.crushedWidth, m.crushedHeight)
            .setY(m.curbY + (m.canHeight - m.crushedHeight) / 2);

        this.spawnImpactShockwave(m.targetX, m.curbY + 22, canCfg.color);

        this.playerScore++;
        this.currentStreak++;
        if (this.playerScore > this.highScore) {
            this.highScore = this.playerScore;
        }
        if (this.currentStreak > this.bestStreak) {
            this.bestStreak = this.currentStreak;
        }
        this.saveLocalScores();
        this.playerScoreText.setText(`${this.playerScore}`);
        this.playerScoreText.setColor(this.currentStreak >= 3 ? '#ffdd00' : '#ffffff');

        this.tweens.killTweensOf(this.playerScoreText);
        this.playerScoreText.setScale(1.35);
        this.tweens.add({
            targets: this.playerScoreText,
            scaleX: 1,
            scaleY: 1,
            duration: 160,
            ease: 'Back.easeOut'
        });

        this.incrementWorldScore();

        if (g.streakForTimeBonus && this.currentStreak % g.streakForTimeBonus === 0) {
            this.roundTimeRemaining = Math.min(g.roundDuration, this.roundTimeRemaining + (g.streakTimeBonusMs || 2000));
            this.showAlert(t.bonusTimeAlert, '#ffdd00');
            this.spawnFloatingText(m.targetX, m.curbY - 12, '+1  (+2.0s!)', '#ffdd00', '14px');
        } else {
            const msg = this.currentStreak > 1 ? `${t.streakPrefix}${this.currentStreak}! (+1)` : t.winStatus;
            this.showAlert(msg, '#00ffcc');
            const popLabel = this.currentStreak > 1 ? `+1 (x${this.currentStreak})` : '+1';
            this.spawnFloatingText(m.targetX, m.curbY - 10, popLabel, '#00ffcc', '13px');
        }

        this.tweens.add({
            targets: this.boot,
            y: m.bootRestY,
            displayWidth: m.bootWidth,
            displayHeight: m.bootHeight,
            delay: 80,
            duration: 135,
            ease: 'Back.easeOut'
        });

        this.tweens.add({
            targets: this.targetSprite,
            x: -60,
            angle: -20,
            delay: 90,
            duration: g.slideOutDuration || 105,
            ease: 'Quad.easeIn',
            onComplete: () => {
                this.spawnNextItem(true);
            }
        });
    }

    handleHazardImpaled() {
        const m = ASSETS_CONFIG.metrics;
        const t = ASSETS_CONFIG.text;
        const g = ASSETS_CONFIG.gameplay;

        this.playSound('impaleScream');
        this.cameras.main.shake(180, 0.02);
        this.cameras.main.flash(120, 255, 0, 55);

        this.isBootCurrentlyBloody = true;
        this.boot.setTexture('stompBootBloody').setDisplaySize(m.bootWidth, m.bootHeight);

        this.curbStainGraphics.fillStyle(0x99001a, 0.55);
        this.curbStainGraphics.fillEllipse(
            m.targetX + Phaser.Math.Between(-18, 18),
            m.curbY + 24 + Phaser.Math.Between(-3, 4),
            Phaser.Math.Between(22, 38),
            Phaser.Math.Between(6, 11)
        );

        const dropCount = g.bloodDropCount || 16;
        for (let i = 0; i < dropCount; i++) {
            const scale = Phaser.Math.FloatBetween(0.65, 1.15);
            const sprite = this.add.image(m.targetX + Phaser.Math.Between(-10, 10), m.curbY + 12, 'bloodDrop')
                .setDisplaySize(m.bloodDropWidth * scale, m.bloodDropHeight * scale)
                .setDepth(14);

            const vx = Phaser.Math.Between(-145, 145);
            const vy = Phaser.Math.Between(-210, -55);
            sprite.rotation = Math.atan2(vy, vx) - Math.PI / 2;

            this.bloodDrops.push({
                sprite,
                vx,
                vy,
                life: Phaser.Math.Between(320, 580)
            });
        }

        this.currentStreak = 0;
        if (g.allowNegativeScore) {
            this.playerScore--;
        } else {
            this.playerScore = Math.max(0, this.playerScore - 1);
        }
        this.saveLocalScores();
        this.playerScoreText.setText(`${this.playerScore}`).setColor('#ff0055');

        this.showAlert(t.impaledStatus, '#ff0055');
        this.spawnFloatingText(m.targetX, m.curbY - 14, '-1 OUCH!', '#ff0055', '14px');

        this.tweens.add({
            targets: this.boot,
            y: m.bootRestY,
            displayWidth: m.bootWidth,
            displayHeight: m.bootHeight,
            angle: -7,
            delay: 130,
            duration: 190,
            ease: 'Sine.easeOut',
            onComplete: () => {
                this.boot.setAngle(0);
            }
        });

        this.tweens.add({
            targets: this.targetSprite,
            x: -60,
            delay: 150,
            duration: g.slideOutDuration || 105,
            ease: 'Quad.easeIn',
            onComplete: () => {
                this.spawnNextItem(true);
            }
        });
    }

    saveLocalScores() {
        try {
            localStorage.setItem('grimy_stomp_high', this.highScore);
            localStorage.setItem('grimy_stomp_streak', this.bestStreak);
        } catch (e) {}
    }

    playSound(key) {
        if (this.isMuted) return;
        const audio = LOADED_HTML_AUDIO[key];
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } else {
            this.playSynthFallback(key);
        }
    }

    playSynthFallback(key) {
        try {
            const ctx = this.sound.context;
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            const now = ctx.currentTime;
            if (key === 'crushWin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.14);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (key === 'impaleScream' || key === 'roundOver') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(480, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.26);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.26);
                osc.start(now);
                osc.stop(now + 0.26);
            } else if (key === 'hazardSlide') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(410, now);
                osc.frequency.exponentialRampToValueAtTime(175, now + 0.085);
                gain.gain.setValueAtTime(0.13, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.085);
                osc.start(now);
                osc.stop(now + 0.085);
            } else if (key === 'bootWhoosh' || key === 'canSlide') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.07);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
                osc.start(now);
                osc.stop(now + 0.07);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(680, now);
                osc.frequency.exponentialRampToValueAtTime(920, now + 0.04);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            }
        } catch (e) {}
    }

    createFallbackTextures() {
        const g = this.make.graphics({ x: 0, y: 0, add: false });
        const m = ASSETS_CONFIG.metrics;
        const t = ASSETS_CONFIG.text;
        const font = ASSETS_CONFIG.fontFamily;

        if (!this.textures.exists('background')) {
            g.clear();
            g.fillStyle(0x0c0c0e, 1);
            g.fillRect(0, 0, 300, 250);
            g.fillStyle(0x1a1a1f, 1);
            g.fillRect(0, 194, 300, 56);
            g.lineStyle(2, 0x2e2e36, 1);
            g.lineBetween(0, 194, 300, 194);
            g.generateTexture('background', 300, 250);
        }

        if (!this.textures.exists('bloodDrop')) {
            const bw = m.bloodDropWidth;
            const bh = m.bloodDropHeight;
            const canvas = this.textures.createCanvas('bloodDrop', bw, bh);
            const ctx = canvas.context;

            ctx.fillStyle = '#e60026';

    async fetchWorldScore() {
        try {
            const url = `https://api.counterapi.dev/v1/${GLOBAL_API_NAMESPACE}/${GLOBAL_API_KEY}`;
            const res = await fetch(url, { headers: { 'Cache-Control': 'no-cache' }, cache: 'no-store' });
            if (res.ok) {
                const data = await res.json();
                const serverCount = data.count !== undefined ? data.count : data.value;
                if (typeof serverCount === 'number') {
                    this.worldScore = Math.max(this.worldScore, serverCount);
                    this.worldScoreText.setText(`${this.worldScore + WORLD_SCORE_OFFSET}`);
                }
            } else if (res.status === 404 && this.worldScore === 0) {
                this.worldScoreText.setText(`${WORLD_SCORE_OFFSET}`);
            }
        } catch (e) {
            if (this.worldScore === 0) this.worldScoreText.setText(`${WORLD_SCORE_OFFSET}`);
        }
    }

    async incrementWorldScore() {
        this.worldScore++;
        this.worldScoreText.setText(`${this.worldScore + WORLD_SCORE_OFFSET}`);
        try {
            const url = `https://api.counterapi.dev/v1/${GLOBAL_API_NAMESPACE}/${GLOBAL_API_KEY}/up`;
            const res = await fetch(url, { headers: { 'Cache-Control': 'no-cache' }, cache: 'no-store' });
            if (res.ok) {
                const data = await res.json();
                const serverCount = data.count !== undefined ? data.count : data.value;
                if (typeof serverCount === 'number') {
                    this.worldScore = Math.max(this.worldScore, serverCount);
                    this.worldScoreText.setText(`${this.worldScore + WORLD_SCORE_OFFSET}`);
                }
            }
        } catch (e) {
            console.warn("Global server increment blocked or offline.");
        }
    }
}
