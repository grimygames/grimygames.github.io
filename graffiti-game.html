    <style>
        * {

        }
        html, body {

            background-color: transparent;
            font-family: 'Raleway', sans-serif;
        }
        #game-container {
            width: 300px;
            height: 250px;
            position: relative;
            border: 2px solid #222;
            box-sizing: content-box;
            transition: border-color 0.3s ease;

        .font-preload {
            font-family: 'Raleway', sans-serif;
            font-weight: 900;
            position: absolute;
            left: -9999px;
            visibility: hidden;
        }
    </style>

// 2. LOCAL DRIVE (file://) PRELOADER
// ============================================================================
const LOADED_HTML_IMAGES = {};
const LOADED_HTML_AUDIO = {};

function preloadLocalAssets(onReady) {
    const allImageEntries = [
        ...Object.entries(ASSETS_CONFIG.images),
        ...ASSETS_CONFIG.stations.map(st => [st.key, st.path]),
        ...ASSETS_CONFIG.stations.map(st => [st.bgKey, st.bgPath]),
        ...ASSETS_CONFIG.stickers.map(sk => [sk.key, sk.path])
    ];
    let remaining = allImageEntries.length;

    Object.entries(ASSETS_CONFIG.audio).forEach(([key, path]) => {
        if (!path) return;
        const cleanPath = path.replace(/\\/g, '/');
        const audio = new Audio();
        audio.src = cleanPath;
        audio.preload = 'auto';
        audio.addEventListener('canplaythrough', () => {
            LOADED_HTML_AUDIO[key] = audio;
        }, { once: true });
        audio.addEventListener('error', () => {}, { once: true });
    });

    const startWhenFontReady = () => {
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => onReady()).catch(() => onReady());
        } else {
            onReady();
        }
    };

    if (remaining === 0) {
        startWhenFontReady();
        return;
    }

    const checkDone = () => {
        remaining--;
        if (remaining <= 0) startWhenFontReady();
    };

    allImageEntries.forEach(([key, path]) => {
        if (!path) {
            checkDone();
            return;
        }
        const cleanPath = path.replace(/\\/g, '/');
        const img = new Image();
        img.onload = () => {
            LOADED_HTML_IMAGES[key] = img;
            checkDone();
        };
        img.onerror = () => {
            checkDone();
        };
        img.src = cleanPath;
    });
}

// 3. MAIN PHASER GAME SCENE
// ============================================================================
class GraffitiGame extends Phaser.Scene {
    constructor() {
        super('GraffitiGame');
        this.currentStation = 0;
        this.isPanning = false;
        this.isDrawing = false;
        this.isModalOpen = false;
        this.isMenuOpen = false;
        this.isTrayOpen = false;
        this.isMuted = localStorage.getItem('grimy_tag_muted') === 'true';

        this.selectedColorIndex = 6;
        this.selectedSizeIndex = 2; // Starts on 'M' (index 2 of XS, S, M, L)
        this.selectedStyleIndex = 2;
        this.isEraser = false;
        this.activeSticker = null;
        this.stickerAngle = 0;

        // Feature & Visibility Toggles
        this.isTransparentBg = Boolean(ASSETS_CONFIG.gameplay.defaultTransparentBg);
        this.isTargetPngVisible = ASSETS_CONFIG.gameplay.defaultShowTargetPng !== false;
        // Layer 2 = Target PNG (Masked), Layer 1 = Station Background Image (Full 300x250)
        this.currentLayer = this.isTargetPngVisible ? (ASSETS_CONFIG.gameplay.defaultLayer || 2) : 1;

        this.isDripMode = false;
        this.isSplatMode = false;
        this.isRainbowMode = false;
        this.rainbowStepCounter = 0;
        this.activeDrips = [];

        this.zoomLevel = 1.0;
        this.panOffsetX = 0;
        this.panOffsetY = 0;

        this.lastDrawX = null;
        this.lastDrawY = null;

        this.trayScrollX = 0;
        this.isDraggingTray = false;
        this.trayDragStartX = 0;
        this.trayDragMoved = false;
    }

    create() {
        Object.entries(LOADED_HTML_IMAGES).forEach(([key, imgElement]) => {
            if (!this.textures.exists(key)) {
                this.textures.addImage(key, imgElement);
            }
        });

        this.createFallbackTextures();
        this.createBrushAndEraserTextures();

        // 1. WORLD CONTAINER
        this.worldContainer = this.add.container(0, 0).setDepth(1);

        // Setup all 5 Stations: Each station gets its own Background Sprite + BG Paint Layer (L1) + Target PNG + Target Paint Layer (L2)
        this.stations = [];
        const showBgAtStart = !(this.isTransparentBg && ASSETS_CONFIG.gameplay.hideWallWhenTransparent);

        ASSETS_CONFIG.stations.forEach((stCfg, index) => {
            const bgW = stCfg.bgWidth || 300;
            const bgH = stCfg.bgHeight || 250;
            const bgLeftX = index * 300;
            const bgCenterX = bgLeftX + 150;
            const bgCenterY = 125;

            const centerX = bgLeftX + 150;
            const centerY = 114;

            // 1A. Station Default Background Image (300x250 per station)
            const bgSprite = this.add.image(bgCenterX, bgCenterY, stCfg.bgKey)
                .setDisplaySize(bgW, bgH)
                .setVisible(showBgAtStart);

            // 1B. Layer 1: Background Paint RenderTexture (Full 300x250 area — draws directly on the background image!)
            const rtBg = this.add.renderTexture(bgLeftX, 0, bgW, bgH)
                .setOrigin(0, 0)
                .setVisible(showBgAtStart);

            // 1C. Base Station Target PNG (220x155 with transparency)
            const baseSprite = this.add.image(centerX, centerY, stCfg.key)
                .setDisplaySize(stCfg.width, stCfg.height)
                .setVisible(this.isTargetPngVisible);

            // 1D. Layer 2: Top Target Paint RenderTexture (220x155 — strictly masked to visible PNG pixels)
            const rtOver = this.add.renderTexture(
                centerX - stCfg.width / 2,
                centerY - stCfg.height / 2,
                stCfg.width,
                stCfg.height
            ).setOrigin(0, 0).setVisible(this.isTargetPngVisible);

            // Undo buffer holds both the 300x250 Background Paint and 220x155 Target PNG Paint
            const undoKey = `undo_buf_${index}`;
            if (this.textures.exists(undoKey)) this.textures.remove(undoKey);
            const undoTex = this.textures.createCanvas(undoKey, bgW, bgH + stCfg.height);

            this.worldContainer.add([bgSprite, rtBg, baseSprite, rtOver]);

            const stObj = {
                bgSprite,
                rtBg,
                baseSprite,
                rtOver,
                maskCanvas: null,
                undoKey,
                undoTex,
                hasUndo: false,
                bgLeftX,
                bgCenterX,
                bgCenterY,
                bgW,
                bgH,
                centerX,
                centerY,
                cfg: stCfg
            };

            // Build 100% solid binary alpha mask for the Target PNG
            this.rebuildStationBinaryMask(stObj);

            this.stations.push(stObj);
        });

        this.stickerStampSprite = this.make.image({ x: 0, y: 0, key: 'logo', add: false }).setOrigin(0.5);

        // 2. LIVE CURSORS
        this.brushCursor = this.add.circle(150, 114, BRUSH_SIZES[this.selectedSizeIndex].radius)
            .setStrokeStyle(1.5, SPRAY_COLORS[this.selectedColorIndex].hex, 0.85)
            .setDepth(20)
            .setVisible(false);

        this.stickerPreview = this.add.image(150, 114, 'logo')
            .setAlpha(0.75)
            .setDepth(20)
            .setVisible(false);

        // 3. TOP HUD BAR (Includes Camera + Hamburger Menu Button)
        this.buildTopBar();

        // 4. SIDE COLUMNS (Left & Right 5-Slot Stack)
        this.buildSideColumns();

        // 5. BOTTOM TOOLBAR
        this.buildBottomToolbar();

        // 6. STICKER TRAY, HAMBURGER MENU MODAL & CREDITS MODAL
        this.buildStickerTray();
        this.buildHamburgerMenuModal();
        this.buildCreditsModal();

        // 7. INPUT & FILE UPLOAD LISTENERS (Target PNG + Background Image)
        this.setupInputListeners();
        this.setupFileUploadListeners();
    }

    // ========================================================================
    // SOLID BINARY MASK BUILDER & PIXEL-PERFECT CLIPPING (FOR TARGET PNG LAYER 2)
    // ========================================================================
    rebuildStationBinaryMask(st) {
        const w = st.cfg.width;
        const h = st.cfg.height;
        const baseImg = st.baseSprite.texture.getSourceImage();
        if (!baseImg) return;

        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w;
        maskCanvas.height = h;
        const mCtx = maskCanvas.getContext('2d');
        mCtx.clearRect(0, 0, w, h);
        mCtx.drawImage(baseImg, 0, 0, w, h);

        try {
            const imgData = mCtx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const threshold = ASSETS_CONFIG.gameplay.maskAlphaThreshold !== undefined
                ? ASSETS_CONFIG.gameplay.maskAlphaThreshold
                : 10;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] >= threshold) {
                    data[i] = 255;
                    data[i + 1] = 255;
                    data[i + 2] = 255;
                    data[i + 3] = 255;
                } else {
                    data[i + 3] = 0;
                }
            }
            mCtx.putImageData(imgData, 0, 0);
        } catch (err) {
            mCtx.drawImage(baseImg, 0, 0, w, h);
            mCtx.drawImage(baseImg, 0, 0, w, h);
            mCtx.drawImage(baseImg, 0, 0, w, h);
        }

        st.maskCanvas = maskCanvas;
    }

    applyLayerMask(st, layerNum) {
        // Layer 1 draws directly on the full 300x250 Background Image (no PNG mask)
        // Layer 2 draws on the Target PNG and clips to the PNG's opaque pixels
        if (layerNum !== 2 || !ASSETS_CONFIG.gameplay.maskTopLayer) return;

        const targetRt = st.rtOver;
        const rtCanvas = targetRt.canvas || targetRt.texture.getSourceImage();
        const ctx = targetRt.context || (rtCanvas && rtCanvas.getContext('2d'));
        const maskSource = st.maskCanvas || st.baseSprite.texture.getSourceImage();

        if (!ctx || !maskSource) return;

        ctx.save();
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(maskSource, 0, 0, st.cfg.width, st.cfg.height);
        ctx.restore();
    }

    openHamburgerMenu() {
        this.stopDrawing();
        if (this.isTrayOpen) {
            this.isTrayOpen = false;
            this.stickerTray.setVisible(false);
        }
        this.isModalOpen = true;
        this.isMenuOpen = true;
        this.menuStatusText.setText(ASSETS_CONFIG.text.menuHintDefault).setColor('#aaaaaa');
        this.menuModal.setVisible(true).setAlpha(0);
        this.playSound('menuOpenSfx');
        this.tweens.add({ targets: this.menuModal, alpha: 1, duration: 150 });
    }

    closeHamburgerMenu() {
        this.playSound('menuCloseSfx');
        this.isModalOpen = false;
        this.isMenuOpen = false;
        this.menuModal.setVisible(false);
    }

    updateBackgroundVisibility() {
        const showBg = !(this.isTransparentBg && ASSETS_CONFIG.gameplay.hideWallWhenTransparent);
        this.stations.forEach(st => {
            st.bgSprite.setVisible(showBg);
            st.rtBg.setVisible(showBg);
        });
    }

    toggleTransparentBg() {
        const m = ASSETS_CONFIG.uiMetrics;
        const t = ASSETS_CONFIG.text;

        this.isTransparentBg = !this.isTransparentBg;
        this.menuTransBtn
            .setTexture(this.isTransparentBg ? 'transBgOn' : 'transBgOff')
            .setDisplaySize(m.toggleBtnWidth, m.toggleBtnHeight);

        this.updateBackgroundVisibility();

        // If user hides the background while on Layer 1 (BG), make sure Target PNG is visible and switch to Layer 2
        if (this.isTransparentBg) {
            if (!this.isTargetPngVisible) {
                this.isTargetPngVisible = true;
                this.menuTargetPngBtn.setTexture('targetPngOn').setDisplaySize(m.toggleBtnWidth, m.toggleBtnHeight);
                this.stations.forEach(st => {
                    st.baseSprite.setVisible(true);
                    st.rtOver.setVisible(true);
                });
            }
            this.currentLayer = 2;
            this.layersHighlight.setVisible(true);
        }

        const msg = this.isTransparentBg ? t.transBgOnStatus : t.transBgOffStatus;
        const col = this.isTransparentBg ? '#00ffcc' : '#ffcc00';
        this.menuStatusText.setText(msg).setColor(col);
        this.flashStatus(msg, col, 900);
        this.playSound('transToggleSfx');
    }

    toggleTargetPngVisibility() {
        const m = ASSETS_CONFIG.uiMetrics;
        const t = ASSETS_CONFIG.text;

        this.isTargetPngVisible = !this.isTargetPngVisible;
        this.menuTargetPngBtn
            .setTexture(this.isTargetPngVisible ? 'targetPngOn' : 'targetPngOff')
            .setDisplaySize(m.toggleBtnWidth, m.toggleBtnHeight);

        // Show or hide the target PNG and its masked top paint layer across all stations
        this.stations.forEach(st => {
            st.baseSprite.setVisible(this.isTargetPngVisible);
            st.rtOver.setVisible(this.isTargetPngVisible);
        });

        // Automatically switch to Layer 1 (Background Image) when PNG is hidden, or back to Layer 2 when shown
        if (!this.isTargetPngVisible) {
            this.currentLayer = 1;
            this.layersHighlight.setVisible(false);
            if (this.isTransparentBg) {
                this.isTransparentBg = false;
                this.menuTransBtn.setTexture('transBgOff').setDisplaySize(m.toggleBtnWidth, m.toggleBtnHeight);
                this.updateBackgroundVisibility();
            }
        } else {
            this.currentLayer = 2;
            this.layersHighlight.setVisible(true);
        }

        const msg = this.isTargetPngVisible ? t.targetPngOnStatus : t.targetPngOffStatus;
        const col = this.isTargetPngVisible ? '#00ffcc' : '#ffcc00';
        this.menuStatusText.setText(msg).setColor(col);
        this.flashStatus(msg, col, 950);
        this.playSound('targetToggleSfx');
    }

    // ========================================================================
    // CUSTOM TARGET PNG & CUSTOM STATION BACKGROUND UPLOADS
    // ========================================================================
    triggerPngUpload() {
        const fileInput = document.getElementById('png-upload-input');
        if (fileInput) {
            fileInput.value = '';
            fileInput.click();
        }
    }

    triggerBgUpload() {
        const bgInput = document.getElementById('bg-upload-input');
        if (bgInput) {
            bgInput.value = '';
            bgInput.click();
        }
    }

    setupFileUploadListeners() {
        const gCfg = ASSETS_CONFIG.gameplay;
        const t = ASSETS_CONFIG.text;
        const maxBytes = (gCfg.maxUploadFileSizeKB || 2048) * 1024;
        const maxW = gCfg.maxUploadWidth || 1500;
        const maxH = gCfg.maxUploadHeight || 1500;

        // 1. Target PNG Upload Listener
        const pngInput = document.getElementById('png-upload-input');
        if (pngInput) {
            pngInput.addEventListener('change', (ev) => {
                const file = ev.target.files && ev.target.files[0];
                if (!file) return;

                if (file.type !== 'image/png' && !file.name.toLowerCase().endsWith('.png')) {
                    this.showUploadError(t.uploadFormatError);
                    return;
                }
                if (file.size > maxBytes) {
                    this.showUploadError(t.uploadFileSizeError);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (loadEv) => {
                    const img = new Image();
                    img.onload = () => {
                        if (img.width > maxW || img.height > maxH) {
                            this.showUploadError(t.uploadDimensionError);
                            return;
                        }
                        this.applyUploadedPngToStation(img);
                    };
                    img.onerror = () => this.showUploadError(t.uploadFormatError);
                    img.src = loadEv.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 2. Per-Station Background Upload Listener
        const bgInput = document.getElementById('bg-upload-input');
        if (bgInput) {
            bgInput.addEventListener('change', (ev) => {
                const file = ev.target.files && ev.target.files[0];
                if (!file) return;

                const validTypes = ['image/png', 'image/jpeg', 'image/webp'];
                const lowerName = file.name.toLowerCase();
                const validExt = lowerName.endsWith('.png') || lowerName.endsWith('.jpg') || lowerName.endsWith('.jpeg') || lowerName.endsWith('.webp');

                if (!validTypes.includes(file.type) && !validExt) {
                    this.showUploadError(t.uploadBgFormatError);
                    return;
                }
                if (file.size > maxBytes) {
                    this.showUploadError(t.uploadFileSizeError);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (loadEv) => {
                    const img = new Image();
                    img.onload = () => {
                        if (img.width > maxW || img.height > maxH) {
                            this.showUploadError(t.uploadDimensionError);
                            return;
                        }
                        this.applyUploadedBgToStation(img);
                    };
                    img.onerror = () => this.showUploadError(t.uploadBgFormatError);
                    img.src = loadEv.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    }

    showUploadError(errorMsg) {
        this.playSound('uploadErrorSfx');
        if (this.menuStatusText) {
            this.menuStatusText.setText(errorMsg).setColor('#ff0055');
        }
        this.flashStatus(errorMsg, '#ff0055', 1800);
        this.cameras.main.shake(110, 0.01);
    }

    applyUploadedPngToStation(imgElement) {
        const st = this.stations[this.currentStation];
        const w = st.cfg.width;
        const h = st.cfg.height;
        const customKey = `custom_station_${this.currentStation}_${Date.now()}`;

        const texCanvas = this.textures.createCanvas(customKey, w, h);
        const ctx = texCanvas.context;
        ctx.clearRect(0, 0, w, h);

        const scale = Math.min(w / imgElement.width, h / imgElement.height);
        const drawW = imgElement.width * scale;
        const drawH = imgElement.height * scale;
        const offsetX = (w - drawW) / 2;
        const offsetY = (h - drawH) / 2;

        ctx.drawImage(imgElement, offsetX, offsetY, drawW, drawH);
        texCanvas.refresh();

        st.baseSprite.setTexture(customKey).setDisplaySize(w, h);

        if (!this.isTargetPngVisible) {
            this.toggleTargetPngVisibility();
        }

        this.rebuildStationBinaryMask(st);
        this.applyLayerMask(st, 2);

        const t = ASSETS_CONFIG.text;
        this.playSound('uploadSuccessSfx');
        if (this.menuStatusText) {
            this.menuStatusText.setText(t.uploadSuccessStatus).setColor('#00ffcc');
        }
        this.flashStatus(t.uploadSuccessStatus, '#00ffcc', 1200);

        this.time.delayedCall(450, () => {
            if (this.isMenuOpen) this.closeHamburgerMenu();
        });
    }

    applyUploadedBgToStation(imgElement) {
        const st = this.stations[this.currentStation];
        const bgW = st.bgW;
        const bgH = st.bgH;
        const customBgKey = `custom_bg_${this.currentStation}_${Date.now()}`;

        const texCanvas = this.textures.createCanvas(customBgKey, bgW, bgH);
        const ctx = texCanvas.context;
        ctx.fillStyle = '#141416';
        ctx.fillRect(0, 0, bgW, bgH);

        // Cover-fit uploaded background to 300x250 station area
        const scale = Math.max(bgW / imgElement.width, bgH / imgElement.height);
        const drawW = imgElement.width * scale;
        const drawH = imgElement.height * scale;
        const offsetX = (bgW - drawW) / 2;
        const offsetY = (bgH - drawH) / 2;

        ctx.drawImage(imgElement, offsetX, offsetY, drawW, drawH);
        texCanvas.refresh();

        st.bgSprite.setTexture(customBgKey).setDisplaySize(bgW, bgH);

        // Make sure background is visible if Transparent BG was turned on
        if (this.isTransparentBg) {
            this.toggleTransparentBg();
        }

        const t = ASSETS_CONFIG.text;
        this.playSound('uploadBgSuccessSfx');
        if (this.menuStatusText) {
            this.menuStatusText.setText(t.uploadBgSuccessStatus).setColor('#00ffcc');
        }
        this.flashStatus(t.uploadBgSuccessStatus, '#00ffcc', 1200);

        this.time.delayedCall(450, () => {
            if (this.isMenuOpen) this.closeHamburgerMenu();
        });
    }

    getStationTitle(index) {
        const rawName = ASSETS_CONFIG.stations[index].name;
        const layerTag = (!this.isTargetPngVisible || this.currentLayer === 1) ? ` [BG]` : ` [PNG]`;
        const zoomTag = this.zoomLevel > 1 ? ` [${this.zoomLevel.toFixed(1)}x]` : '';
        return `${rawName}${layerTag}${zoomTag}`;
    }

    flashStatus(message, color = '#00ffcc', duration = 850) {
        this.statusText.setText(message).setColor(color);
        if (this.statusTimer) this.statusTimer.remove(false);
        this.statusTimer = this.time.delayedCall(duration, () => {
            this.statusText.setText(this.getStationTitle(this.currentStation)).setColor('#ffffff');
        });
    }

    updateCursorStyle() {
        if (this.activeSticker) {
            this.brushCursor.setVisible(false);
            this.stickerPreview
                .setTexture(this.activeSticker.key)
                .setAngle(this.stickerAngle)
                .setDisplaySize(
                    this.activeSticker.width * this.zoomLevel,
                    this.activeSticker.height * this.zoomLevel
                );
            return;
        }

        this.stickerPreview.setVisible(false);
        const r = BRUSH_SIZES[this.selectedSizeIndex].radius * this.zoomLevel;
        this.brushCursor.setRadius(r);
        if (this.isEraser) {
            this.brushCursor.setStrokeStyle(1.5, 0xff99aa, 0.9);
        } else {
            const hex = SPRAY_COLORS[this.selectedColorIndex].hex;
            this.brushCursor.setStrokeStyle(1.5, hex === 0x111111 ? 0xffffff : hex, 0.85);
        }
    }

    // ========================================================================
    // FEATURE TOGGLES (LAYERS: TARGET PNG vs BACKGROUND IMAGE, DRIP, SPLAT, RAINBOW)
    // ========================================================================
    toggleLayer() {
        if (this.isModalOpen) return;
        const t = ASSETS_CONFIG.text;

        if (!this.isTargetPngVisible) {
            this.playSound('uploadErrorSfx');
            this.flashStatus(t.pngHiddenLayerNotice, '#ff99aa', 1100);
            return;
        }

        if (this.currentLayer === 2 && this.isTransparentBg && ASSETS_CONFIG.gameplay.hideWallWhenTransparent) {
            this.playSound('uploadErrorSfx');
            this.flashStatus(t.bgHiddenLayerNotice, '#ff99aa', 1100);
            return;
        }

        this.playSound('layersSfx');

        if (this.currentLayer === 1) {
            this.currentLayer = 2;
            this.layersHighlight.setVisible(true);
            this.flashStatus(t.layer2Status, '#00ffcc');
        } else {
            this.currentLayer = 1;
            this.layersHighlight.setVisible(false);
            this.flashStatus(t.layer1Status, '#ffcc00');
        }
    }

    toggleDripMode() {
        if (this.isModalOpen) return;
        this.isDripMode = !this.isDripMode;
        this.dripHighlight.setVisible(this.isDripMode);
        this.playSound('dripToggleSfx');
        const t = ASSETS_CONFIG.text;
        this.flashStatus(this.isDripMode ? t.dripOnStatus : t.dripOffStatus, this.isDripMode ? '#00dd44' : '#cccccc');
    }

    toggleSplatMode() {
        if (this.isModalOpen) return;
        this.isSplatMode = !this.isSplatMode;
        this.splatHighlight.setVisible(this.isSplatMode);
        this.playSound('splatToggleSfx');
        const t = ASSETS_CONFIG.text;
        this.flashStatus(this.isSplatMode ? t.splatOnStatus : t.splatOffStatus, this.isSplatMode ? '#ff7700' : '#cccccc');
    }

    toggleRainbowOrRotateSticker() {
        if (this.isModalOpen) return;
        const t = ASSETS_CONFIG.text;

        if (this.activeSticker) {
            const step = ASSETS_CONFIG.gameplay.stickerRotateStep || 15;
            this.stickerAngle = (this.stickerAngle + step) % 360;
            this.updateCursorStyle();
            this.playSound('rainbowToggleSfx');
            this.flashStatus(`${t.stickerRotatePrefix}${this.stickerAngle}°`, '#ffff00');
            return;
        }

        this.isRainbowMode = !this.isRainbowMode;
        this.rainbowHighlight.setVisible(this.isRainbowMode);
        this.playSound('rainbowToggleSfx');
        this.flashStatus(this.isRainbowMode ? t.rainbowOnStatus : t.rainbowOffStatus, this.isRainbowMode ? '#ff33aa' : '#cccccc');
    }

    // ========================================================================
    // ZOOM IN & ZOOM OUT ENGINE
    // ========================================================================
    changeZoom(delta, pivotScreenX = 150, pivotScreenY = 114) {
        if (this.isPanning || this.isModalOpen) return;
        const m = ASSETS_CONFIG.uiMetrics;
        const oldZoom = this.zoomLevel;
        const newZoom = Phaser.Math.Clamp(
            Math.round((this.zoomLevel + delta) * 100) / 100,
            m.minZoom,
            m.maxZoom
        );

        if (newZoom === oldZoom) return;

        this.playSound(newZoom > oldZoom ? 'zoomInSfx' : 'zoomOutSfx');
        this.zoomLevel = newZoom;

        if (newZoom <= 1.0) {
            this.panOffsetX = 0;
            this.panOffsetY = 0;
        } else {
            const ratio = newZoom / oldZoom;
            this.panOffsetX = (pivotScreenX - 150) - ((pivotScreenX - 150 - this.panOffsetX) * ratio);
            this.panOffsetY = (pivotScreenY - 114) - ((pivotScreenY - 114 - this.panOffsetY) * ratio);
            this.clampPanOffsets();
        }

        this.applyWorldTransform();
        this.updateCursorStyle();
        this.flashStatus(this.getStationTitle(this.currentStation), '#00ffcc', 600);
    }

    clampPanOffsets() {
        const maxPanX = Math.max(0, (300 * this.zoomLevel - 180) / 2);
        const maxPanY = Math.max(0, (250 * this.zoomLevel - 120) / 2);
        this.panOffsetX = Phaser.Math.Clamp(this.panOffsetX, -maxPanX, maxPanX);
        this.panOffsetY = Phaser.Math.Clamp(this.panOffsetY, -maxPanY, maxPanY);
    }

    applyWorldTransform() {
        const z = this.zoomLevel;
        this.worldContainer.setScale(z);
        this.worldContainer.x = (150 + this.panOffsetX) - (150 + this.currentStation * 300) * z;
        this.worldContainer.y = (114 + this.panOffsetY) - 125 * z;
    }

    // ========================================================================
    // 1-STEP "OOPS" UNDO SYSTEM (SAVES BOTH BG PAINT & TARGET PNG PAINT)
    // ========================================================================
    saveUndoState() {
        const st = this.stations[this.currentStation];
        const bgW = st.bgW;
        const bgH = st.bgH;
        const overH = st.cfg.height;

        const ctx = st.undoTex.context;
        ctx.clearRect(0, 0, bgW, bgH + overH);
        ctx.drawImage(st.rtBg.texture.getSourceImage(), 0, 0);
        ctx.drawImage(st.rtOver.texture.getSourceImage(), 0, bgH);
        st.undoTex.refresh();
        st.hasUndo = true;
    }

    performUndo() {
        this.playSound('undoSfx');
        const st = this.stations[this.currentStation];
        const bgW = st.bgW;
        const bgH = st.bgH;
        const overH = st.cfg.height;
        const t = ASSETS_CONFIG.text;

        this.activeDrips = this.activeDrips.filter(d => d.stationIndex !== this.currentStation);

        if (!st.hasUndo) {
            this.flashStatus(t.undoEmptyStatus, '#ff99aa', 700);
            return;
        }

        const currentCanvas = document.createElement('canvas');
        currentCanvas.width = bgW;
        currentCanvas.height = bgH + overH;
        const cCtx = currentCanvas.getContext('2d');
        cCtx.drawImage(st.rtBg.texture.getSourceImage(), 0, 0);
        cCtx.drawImage(st.rtOver.texture.getSourceImage(), 0, bgH);

        st.rtBg.clear();
        st.rtOver.clear();
        st.rtBg.draw(st.undoKey, 0, 0);
        st.rtOver.draw(st.undoKey, 0, -bgH);

        const ctx = st.undoTex.context;
        ctx.clearRect(0, 0, bgW, bgH + overH);
        ctx.drawImage(currentCanvas, 0, 0);
        st.undoTex.refresh();

        this.flashStatus(t.undoSuccessStatus, '#00ffcc', 800);
    }

    // ========================================================================
    // SCROLLABLE STICKER TRAY (TRANSPARENT SLOT BACKGROUNDS + BLACK BORDER)
    // ========================================================================
    buildStickerTray() {
        const m = ASSETS_CONFIG.uiMetrics;
        this.stickerTray = this.add.container(0, 0).setDepth(60).setVisible(false);

        const bg = this.add.image(m.trayX, m.trayY, 'stickerTrayBg')
            .setDisplaySize(m.trayWidth, m.trayHeight)
            .setInteractive();

        const viewWidth = m.trayWidth - 52;
        const viewLeft = m.trayX - viewWidth / 2;
        const viewTop = m.trayY - m.trayHeight / 2 + 4;

        const maskShape = this.make.graphics({ x: 0, y: 0, add: false });
        maskShape.fillStyle(0xffffff);
        maskShape.fillRect(viewLeft, viewTop, viewWidth, m.trayHeight - 8);
        const trayMask = maskShape.createGeometryMask();

        this.trayItemsContainer = this.add.container(viewLeft + 28, m.trayY);
        this.trayItemsContainer.setMask(trayMask);

        this.stickerThumbBoxes = [];
        ASSETS_CONFIG.stickers.forEach((sk, idx) => {
            const itemX = idx * m.trayItemSpacing;

            const slotBg = this.add.rectangle(itemX, 0, m.trayThumbSize + 6, m.trayThumbSize + 6)
                .setFillStyle(0x000000, 0)
                .setStrokeStyle(m.stickerSlotBorderWidth, m.stickerSlotBorderColor)
                .setInteractive({ useHandCursor: true });

            const scale = Math.min(m.trayThumbSize / sk.width, m.trayThumbSize / sk.height);
            const thumb = this.add.image(itemX, 0, sk.key)
                .setDisplaySize(sk.width * scale, sk.height * scale);

            slotBg.on('pointerup', () => {
                if (this.trayDragMoved) return;
                this.selectSticker(sk, idx);
            });

            this.stickerThumbBoxes.push(slotBg);
            this.trayItemsContainer.add([slotBg, thumb]);
        });

        const totalContentWidth = Math.max(0, (ASSETS_CONFIG.stickers.length - 1) * m.trayItemSpacing + m.trayThumbSize + 12);
        this.maxTrayScroll = Math.max(0, totalContentWidth - viewWidth);
        this.trayBaseX = viewLeft + 28;

        const leftScrollBtn = this.add.image(m.trayX - m.trayWidth / 2 + 13, m.trayY, 'arrowLeft')
            .setDisplaySize(16, 42)
            .setInteractive({ useHandCursor: true });
        leftScrollBtn.on('pointerdown', (p, lx, ly, ev) => {
            ev.stopPropagation();
            this.scrollStickerTray(-m.trayItemSpacing * 1.5);
            this.playSound('trayScrollSfx');
        });

        const rightScrollBtn = this.add.image(m.trayX + m.trayWidth / 2 - 13, m.trayY, 'arrowRight')
            .setDisplaySize(16, 42)
            .setInteractive({ useHandCursor: true });
        rightScrollBtn.on('pointerdown', (p, lx, ly, ev) => {
            ev.stopPropagation();
            this.scrollStickerTray(m.trayItemSpacing * 1.5);
            this.playSound('trayScrollSfx');
        });

        bg.on('pointerdown', (pointer, lx, ly, ev) => {
            ev.stopPropagation();
            this.isDraggingTray = true;
            this.trayDragStartX = pointer.x;
            this.trayDragStartScroll = this.trayScrollX;
            this.trayDragMoved = false;
        });

        this.stickerTray.add([bg, this.trayItemsContainer, leftScrollBtn, rightScrollBtn]);
    }

    scrollStickerTray(deltaX) {
        this.trayScrollX = Phaser.Math.Clamp(this.trayScrollX + deltaX, 0, this.maxTrayScroll);
        this.trayItemsContainer.x = this.trayBaseX - this.trayScrollX;
    }

    toggleStickerTray() {
        if (this.isModalOpen) return;
        this.stopDrawing();
        this.isTrayOpen = !this.isTrayOpen;
        this.playSound('trayToggleSfx');
        const t = ASSETS_CONFIG.text;

        if (this.isTrayOpen) {
            this.stickerTray.setVisible(true).setAlpha(0);
            this.tweens.add({ targets: this.stickerTray, alpha: 1, duration: 120 });
            this.stickerBtnHighlight.setVisible(true);
            this.statusText.setText(t.stickerTrayPrompt).setColor('#00ffcc');
        } else {
            this.stickerTray.setVisible(false);
            if (!this.activeSticker) {
                this.stickerBtnHighlight.setVisible(false);
                this.statusText.setText(this.getStationTitle(this.currentStation)).setColor('#ffffff');
            }
        }
    }

    selectSticker(stickerCfg, idx) {
        this.playSound('stickerPickSfx');
        this.activeSticker = stickerCfg;
        this.stickerAngle = 0;
        this.isEraser = false;

        const m = ASSETS_CONFIG.uiMetrics;
        this.stickerThumbBoxes.forEach((box, i) => {
            if (i === idx) {
                box.setStrokeStyle(m.selectedBorderWidth, m.selectedBorderColor);
            } else {
                box.setStrokeStyle(m.stickerSlotBorderWidth, m.stickerSlotBorderColor);
            }
        });
        this.colorHighlight.setVisible(false);
        this.eraserHighlight.setVisible(false);
        this.stickerBtnHighlight.setVisible(true);

        this.isTrayOpen = false;
        this.stickerTray.setVisible(false);

        this.updateCursorStyle();
        this.statusText.setText(`${ASSETS_CONFIG.text.stickerSlapPrefix}${stickerCfg.name}`).setColor('#ffff00');
    }

    stampStickerAt(screenX, screenY) {
        if (!this.activeSticker) return;
        this.saveUndoState();

        const st = this.stations[this.currentStation];
        const cfg = st.cfg;
        const worldX = (screenX - this.worldContainer.x) / this.zoomLevel;
        const worldY = (screenY - this.worldContainer.y) / this.zoomLevel;

        const activeLayer = this.isTargetPngVisible ? this.currentLayer : 1;
        const targetRt = activeLayer === 2 ? st.rtOver : st.rtBg;

        const localX = activeLayer === 2
            ? worldX - (st.centerX - cfg.width / 2)
            : worldX - st.bgLeftX;
        const localY = activeLayer === 2
            ? worldY - (st.centerY - cfg.height / 2)
            : worldY;

        this.stickerStampSprite
            .setTexture(this.activeSticker.key)
            .setAngle(this.stickerAngle)
            .setDisplaySize(this.activeSticker.width, this.activeSticker.height);

        targetRt.draw(this.stickerStampSprite, localX, localY);

        this.applyLayerMask(st, activeLayer);

        this.playSound('stickerSlapSfx');
        this.cameras.main.shake(65, 0.007);
    }

    // ========================================================================
    // BOTTOM TOOLBAR (ROW 1: COLORS + ERASE + CLEAR | ROW 2: CREDITS + 4 SIZES + 3 ICON STYLES)
    // ========================================================================

                this.updateCursorStyle();
                this.playSound('canShake');

        this.eraserBtn = this.add.image(m.eraserBtnX, m.row1Y, 'eraserBtn')

        this.eraserBtn.on('pointerdown', (p, lx, ly, ev) => {
            ev.stopPropagation();

            this.activeSticker = null;
            this.isTrayOpen = false;
            this.stickerTray.setVisible(false);
            this.stickerBtnHighlight.setVisible(false);

            this.colorHighlight.setVisible(false);
            this.eraserHighlight.setVisible(true);
            this.statusText.setText(this.getStationTitle(this.currentStation)).setColor('#ffffff');
            this.updateCursorStyle();
            this.playSound('eraserSelect');
        });

        this.clearBtn = this.add.image(m.clearBtnX, m.row1Y, 'clearBtn')
            .setDisplaySize(m.clearBtnWidth, m.clearBtnHeight)
            .setInteractive({ useHandCursor: true })
            .setDepth(27);

        this.clearBtn.on('pointerdown', (p, lx, ly, ev) => {
            ev.stopPropagation();
            this.saveUndoState();
            this.playSound('clearAllSfx');

            this.activeDrips = this.activeDrips.filter(d => d.stationIndex !== this.currentStation);
            const st = this.stations[this.currentStation];
            st.rtBg.clear();
            st.rtOver.clear();

            this.flashStatus(ASSETS_CONFIG.text.clearWallStatus, '#ff0055', 900);

        // ROW 2: Credits Button -> 4 Size Buttons (XS, S, M, L) -> 3 Icon Style Buttons (Soft, Hard, Spray)
        this.creditsBtnBottom = this.add.image(m.creditsBtnX, m.row2Y, 'creditsBtn')
            .setDisplaySize(m.creditsBtnWidth, m.creditsBtnHeight)
            .setInteractive({ useHandCursor: true })
            .setDepth(27);
        this.creditsBtnBottom.on('pointerdown', (p, lx, ly, ev) => { ev.stopPropagation(); this.openCredits(); });

        this.sizeBtns = [];
        BRUSH_SIZES.forEach((sz, idx) => {
            const x = m.sizeStartX + idx * m.sizeSpacingX;
