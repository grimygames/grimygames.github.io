            const btn = this.add.image(x, y, sz.key)
                .setDisplaySize(m.sizeBtnWidth, m.sizeBtnHeight)
                .setInteractive({ useHandCursor: true })
                .setDepth(27);

            if (idx === this.selectedSizeIndex) {
                this.sizeHighlight.setPosition(x, y);
            }

            btn.on('pointerdown', (p, lx, ly, ev) => {
                ev.stopPropagation();
                this.activeSticker = null;
                this.stickerBtnHighlight.setVisible(false);
                if (!this.isEraser) this.colorHighlight.setVisible(true);

                this.selectedSizeIndex = idx;
                this.sizeHighlight.setPosition(x, y);
                this.updateCursorStyle();
                this.playSound('sizeClick');
            });

            this.sizeBtns.push(btn);
        });

        this.styleBtns = [];
        BRUSH_STYLES.forEach((st, idx) => {
            const x = m.styleStartX + idx * m.styleSpacingX;
            const y = m.row2Y;

            const btn = this.add.image(x, y, st.key)
                .setDisplaySize(m.styleBtnWidth, m.styleBtnHeight)
                .setInteractive({ useHandCursor: true })
                .setDepth(27);

            if (idx === this.selectedStyleIndex) {
                this.styleHighlight.setPosition(x, y);
            }

            btn.on('pointerdown', (p, lx, ly, ev) => {
                ev.stopPropagation();
                this.activeSticker = null;
                this.stickerBtnHighlight.setVisible(false);
                if (!this.isEraser) this.colorHighlight.setVisible(true);

                this.selectedStyleIndex = idx;
                this.styleHighlight.setPosition(x, y);
                this.updateCursorStyle();
                this.playSound('styleClick');
            });

            this.styleBtns.push(btn);
        });
    }

    // ========================================================================
    // INPUT LISTENERS
    // ========================================================================
    setupInputListeners() {
        this.input.on('wheel', (pointer, gameObjects, deltaX, deltaY) => {
            if (this.isModalOpen) return;
            if (this.isTrayOpen) {
                const delta = Math.abs(deltaX) > Math.abs(deltaY) ? deltaX : deltaY;
                this.scrollStickerTray(delta * 0.45);
            } else if (pointer.y >= 32 && pointer.y <= 195) {
                const zoomDir = deltaY < 0 ? 0.5 : -0.5;
                this.changeZoom(zoomDir, pointer.x, pointer.y);
            }
        });

        this.input.on('pointerdown', (pointer, currentlyOver) => {
            if (this.isModalOpen || this.isPanning) return;

            if (this.isTrayOpen) {
                if (currentlyOver.length === 0) {
                    this.toggleStickerTray();
                }
                return;
            }

            if (currentlyOver.length > 0 || pointer.y < 32 || pointer.y > 195) return;

            if (pointer.rightButtonDown() || pointer.middleButtonDown()) {
                this.isDraggingCanvas = true;
                this.canvasDragStartX = pointer.x;
                this.canvasDragStartY = pointer.y;
                this.canvasStartOffsetX = this.panOffsetX;
                this.canvasStartOffsetY = this.panOffsetY;
                return;
            }

            if (this.activeSticker) {
                this.stampStickerAt(pointer.x, pointer.y);
                return;
            }

            this.saveUndoState();
            this.isDrawing = true;
            this.lastDrawX = pointer.x;
            this.lastDrawY = pointer.y;

            this.applyBrushAt(pointer.x, pointer.y, true);
            this.startSpraySound();
        });

        this.input.on('pointermove', (pointer) => {
            if (this.isDraggingTray && this.isTrayOpen) {
                const dragDelta = this.trayDragStartX - pointer.x;
                if (Math.abs(dragDelta) > 4) this.trayDragMoved = true;
                this.trayScrollX = Phaser.Math.Clamp(this.trayDragStartScroll + dragDelta, 0, this.maxTrayScroll);
                this.trayItemsContainer.x = this.trayBaseX - this.trayScrollX;
                return;
            }

            if (this.isDraggingCanvas) {
                this.panOffsetX = this.canvasStartOffsetX + (pointer.x - this.canvasDragStartX);
                this.panOffsetY = this.canvasStartOffsetY + (pointer.y - this.canvasDragStartY);
                this.clampPanOffsets();
                this.applyWorldTransform();
                return;
            }

            if (!this.isModalOpen && !this.isTrayOpen && pointer.y >= 32 && pointer.y <= 195) {
                if (this.activeSticker) {
                    this.stickerPreview.setVisible(true).setPosition(pointer.x, pointer.y);
                    this.brushCursor.setVisible(false);
                } else {
                    this.brushCursor.setVisible(true).setPosition(pointer.x, pointer.y);
                    this.stickerPreview.setVisible(false);
                }
            } else {
                this.brushCursor.setVisible(false);
                this.stickerPreview.setVisible(false);
            }

            if (!this.isDrawing || this.isModalOpen || this.isPanning || this.isTrayOpen) return;
            if (pointer.y < 32 || pointer.y > 195) {
                this.stopDrawing();
                return;
            }
            this.applyBrushLine(this.lastDrawX, this.lastDrawY, pointer.x, pointer.y);
            this.lastDrawX = pointer.x;
            this.lastDrawY = pointer.y;
        });

        this.input.on('pointerup', () => {
            this.isDraggingTray = false;
            this.isDraggingCanvas = false;
            this.stopDrawing();
        });

        this.input.on('pointerout', () => {
            this.isDraggingTray = false;
            this.isDraggingCanvas = false;
            this.brushCursor.setVisible(false);
            this.stickerPreview.setVisible(false);
            this.stopDrawing();
        });
    }

    // ========================================================================
    // 2D-CANVAS TEXTURES & BRUSH STAMPING ENGINE
    // ========================================================================
    createBrushAndEraserTextures() {
        SPRAY_COLORS.forEach((col, cIdx) => {
            BRUSH_SIZES.forEach((sz, sIdx) => {
                const r = sz.radius;

                const softKey = `brush_soft_${cIdx}_${sIdx}`;
                if (!this.textures.exists(softKey)) {
                    const canvas = this.textures.createCanvas(softKey, r * 2, r * 2);
                    const ctx = canvas.context;
                    const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
                    grad.addColorStop(0, `rgba(${col.rgb}, 0.92)`);
                    grad.addColorStop(0.55, `rgba(${col.rgb}, 0.5)`);
                    grad.addColorStop(1, `rgba(${col.rgb}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, r * 2, r * 2);
                    canvas.refresh();
                }

                const hardKey = `brush_hard_${cIdx}_${sIdx}`;
                if (!this.textures.exists(hardKey)) {
                    const canvas = this.textures.createCanvas(hardKey, r * 2, r * 2);
                    const ctx = canvas.context;
                    ctx.fillStyle = `rgba(${col.rgb}, 1)`;
                    ctx.beginPath();
                    ctx.arc(r, r, r, 0, Math.PI * 2);
                    ctx.fill();
                    canvas.refresh();
                }

                const sprayKey = `brush_spray_${cIdx}_${sIdx}`;
                if (!this.textures.exists(sprayKey)) {
                    const canvas = this.textures.createCanvas(sprayKey, r * 2, r * 2);
                    const ctx = canvas.context;
                    const grad = ctx.createRadialGradient(r, r, r * 0.25, r, r, r);
                    grad.addColorStop(0, `rgba(${col.rgb}, 1)`);
                    grad.addColorStop(0.65, `rgba(${col.rgb}, 0.65)`);
                    grad.addColorStop(1, `rgba(${col.rgb}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, r * 2, r * 2);
                    canvas.refresh();
                }
            });

            const speckKey = `speck_${cIdx}`;
            if (!this.textures.exists(speckKey)) {
                const canvas = this.textures.createCanvas(speckKey, 4, 4);
                const ctx = canvas.context;
                ctx.fillStyle = `rgba(${col.rgb}, 0.85)`;
                ctx.beginPath();
                ctx.arc(2, 2, 1.5, 0, Math.PI * 2);
                ctx.fill();
                canvas.refresh();
            }

            const dripKey = `drip_${cIdx}`;
            if (!this.textures.exists(dripKey)) {
                const canvas = this.textures.createCanvas(dripKey, 6, 6);
                const ctx = canvas.context;
                ctx.fillStyle = `rgba(${col.rgb}, 0.95)`;
                ctx.beginPath();
                ctx.arc(3, 3, 2.2, 0, Math.PI * 2);
                ctx.fill();
                canvas.refresh();
            }
        });

        BRUSH_SIZES.forEach((sz, sIdx) => {
            const r = sz.radius;

            const eraseSoftKey = `eraser_soft_${sIdx}`;
            if (!this.textures.exists(eraseSoftKey)) {
                const canvas = this.textures.createCanvas(eraseSoftKey, r * 2, r * 2);
                const ctx = canvas.context;
                const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
                grad.addColorStop(0, 'rgba(255,255,255,0.92)');
                grad.addColorStop(0.55, 'rgba(255,255,255,0.5)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, r * 2, r * 2);
                canvas.refresh();
            }

            const eraseHardKey = `eraser_hard_${sIdx}`;
            if (!this.textures.exists(eraseHardKey)) {
                const canvas = this.textures.createCanvas(eraseHardKey, r * 2, r * 2);
                const ctx = canvas.context;
                ctx.fillStyle = 'rgba(255,255,255,1)';
                ctx.beginPath();
                ctx.arc(r, r, r, 0, Math.PI * 2);
                ctx.fill();
                canvas.refresh();
            }

            const eraseSprayKey = `eraser_spray_${sIdx}`;
            if (!this.textures.exists(eraseSprayKey)) {
                const canvas = this.textures.createCanvas(eraseSprayKey, r * 2, r * 2);
                const ctx = canvas.context;
                const grad = ctx.createRadialGradient(r, r, r * 0.25, r, r, r);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.65, 'rgba(255,255,255,0.65)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, r * 2, r * 2);
                canvas.refresh();
            }
        });

        if (!this.textures.exists('eraser_speck')) {
            const canvas = this.textures.createCanvas('eraser_speck', 4, 4);
            const ctx = canvas.context;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath();
            ctx.arc(2, 2, 1.5, 0, Math.PI * 2);
            ctx.fill();
            canvas.refresh();
        }
    }

    applyBrushAt(screenX, screenY, isInitialClick = false) {
        const st = this.stations[this.currentStation];
        const cfg = st.cfg;

        const worldX = (screenX - this.worldContainer.x) / this.zoomLevel;
        const worldY = (screenY - this.worldContainer.y) / this.zoomLevel;

        // Determine whether we are drawing on Layer 2 (Target PNG) or Layer 1 (Full 300x250 Station Background)
        const activeLayer = this.isTargetPngVisible ? this.currentLayer : 1;
        const targetRt = activeLayer === 2 ? st.rtOver : st.rtBg;
        const maxW = activeLayer === 2 ? cfg.width : st.bgW;
        const maxH = activeLayer === 2 ? cfg.height : st.bgH;

        const localX = activeLayer === 2
            ? worldX - (st.centerX - cfg.width / 2)
            : worldX - st.bgLeftX;
        const localY = activeLayer === 2
            ? worldY - (st.centerY - cfg.height / 2)
            : worldY;

        if (localX < -20 || localX > maxW + 20 || localY < -20 || localY > maxH + 20) return;

        // Rainbow Can color cycling
        if (this.isRainbowMode && !this.isEraser) {
            this.rainbowStepCounter++;
            if (this.rainbowStepCounter % 5 === 0) {
                this.selectedColorIndex = (this.selectedColorIndex + 1) % SPRAY_COLORS.length;
                const m = ASSETS_CONFIG.uiMetrics;
                const btnX = m.colorStartX + this.selectedColorIndex * m.colorSpacingX;
                this.colorHighlight.setPosition(btnX, m.row1Y);
                this.updateCursorStyle();
            }
        }

        const radius = BRUSH_SIZES[this.selectedSizeIndex].radius;
        const styleId = BRUSH_STYLES[this.selectedStyleIndex].id;

        if (this.isEraser) {
            const eraseKey = `eraser_${styleId}_${this.selectedSizeIndex}`;
            targetRt.erase(eraseKey, localX - radius, localY - radius);

            if (styleId === 'spray') {
                const speckCount = this.selectedSizeIndex + 2;
                for (let i = 0; i < speckCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = radius * (0.55 + Math.random() * 0.85);
                    const sx = localX + Math.cos(angle) * dist;
                    const sy = localY + Math.sin(angle) * dist;
                    targetRt.erase('eraser_speck', sx - 2, sy - 2);
                }
            }
        } else {
            const cIdx = this.selectedColorIndex;

            // Main Brush Stamp
            const brushKey = `brush_${styleId}_${cIdx}_${this.selectedSizeIndex}`;
            targetRt.draw(brushKey, localX - radius, localY - radius);

            const speckKey = `speck_${cIdx}`;
            if (styleId === 'spray') {
                const speckCount = this.selectedSizeIndex + 2;
                for (let i = 0; i < speckCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = radius * (0.55 + Math.random() * 0.85);
                    const sx = localX + Math.cos(angle) * dist;
                    const sy = localY + Math.sin(angle) * dist;
                    targetRt.draw(speckKey, sx - 2, sy - 2);
                }
            }

            // Optional Splatter Nozzle Burst
            if (this.isSplatMode && (isInitialClick || Math.random() < 0.28)) {
                const burstCount = ASSETS_CONFIG.gameplay.splatBurstCount || 8;
                for (let i = 0; i < burstCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = radius * (0.8 + Math.random() * 2.2);
                    const sx = localX + Math.cos(angle) * dist;
                    const sy = localY + Math.sin(angle) * dist;
                    if (Math.random() < 0.35) {
                        const miniKey = `brush_hard_${cIdx}_1`;
                        targetRt.draw(miniKey, sx - 4, sy - 4);
                    } else {
                        targetRt.draw(speckKey, sx - 2, sy - 2);
                    }
                }
            }

            // Optional Live Running Paint Drips
            const gCfg = ASSETS_CONFIG.gameplay;
            if (this.isDripMode && Math.random() < gCfg.dripSpawnChance && this.activeDrips.length < 18) {
                this.activeDrips.push({
                    stationIndex: this.currentStation,
                    layer: activeLayer,
                    x: localX + Phaser.Math.Between(-radius * 0.4, radius * 0.4),
                    y: localY + radius * 0.3,
                    remaining: Phaser.Math.Between(gCfg.dripMinLength, gCfg.dripMaxLength),
                    colorIndex: cIdx
                });
            }
        }

        // Enforce Solid Binary PNG Mask on Layer 2 (Target PNG)
        this.applyLayerMask(st, activeLayer);
    }

    applyBrushLine(x0, y0, x1, y1) {
        const dist = Phaser.Math.Distance.Between(x0, y0, x1, y1);
        const radius = BRUSH_SIZES[this.selectedSizeIndex].radius;
        const stepSize = radius <= 2 ? 0.8 : (BRUSH_STYLES[this.selectedStyleIndex].id === 'hard' ? 1.5 : 2.5);
        const steps = Math.max(1, Math.ceil(dist / stepSize));
        for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            const ix = Phaser.Math.Linear(x0, x1, t);
            const iy = Phaser.Math.Linear(y0, y1, t);
            this.applyBrushAt(ix, iy, false);
        }
    }

    update(time, delta) {
        if (this.activeDrips.length === 0) return;

        const speed = ASSETS_CONFIG.gameplay.dripSpeed || 28;
        const stepY = (speed * delta) / 1000;
        const touchedStations = new Set();

        for (let i = this.activeDrips.length - 1; i >= 0; i--) {
            const d = this.activeDrips[i];
            const st = this.stations[d.stationIndex];
            const maxH = d.layer === 2 ? st.cfg.height : st.bgH;
            d.y += stepY;
            d.remaining -= stepY;

            if (d.remaining <= 0 || d.y >= maxH - 2) {
                this.activeDrips.splice(i, 1);
                continue;
            }

            const targetRt = d.layer === 2 ? st.rtOver : st.rtBg;
            targetRt.draw(`drip_${d.colorIndex}`, d.x - 3, d.y - 3);
            touchedStations.add(`${d.stationIndex}_${d.layer}`);
        }

        touchedStations.forEach(token => {
            const [sIdx, layerNum] = token.split('_').map(Number);
            this.applyLayerMask(this.stations[sIdx], layerNum);
        });
    }

    stopDrawing() {
        if (!this.isDrawing) return;
        this.isDrawing = false;
        this.stopSpraySound();
    }

    // ========================================================================
    // PANNING & SNAPSHOTS (EXPORTS FULL 300x250 SCENE OR 220x155 TRANSPARENT PNG)
    // ========================================================================
    panStation(dir) {
        if (this.isPanning || this.isModalOpen) return;
        const maxIndex = ASSETS_CONFIG.stations.length - 1;
        const next = Phaser.Math.Clamp(this.currentStation + dir, 0, maxIndex);
        if (next === this.currentStation) return;

        this.stopDrawing();

        if (this.zoomLevel !== 1.0 || this.panOffsetX !== 0 || this.panOffsetY !== 0) {
            this.zoomLevel = 1.0;
            this.panOffsetX = 0;
            this.panOffsetY = 0;
            this.applyWorldTransform();
            this.updateCursorStyle();
        }

        this.currentStation = next;
        this.isPanning = true;
        this.playSound('slideWhoosh');

        const targetWorldX = -this.currentStation * 300;

        this.tweens.add({
            targets: this.worldContainer,
            x: targetWorldX,
            y: 0,
            duration: 380,
            ease: 'Cubic.easeOut',
            onComplete: () => {
                this.isPanning = false;
                this.statusText.setText(this.getStationTitle(this.currentStation)).setColor('#ffffff');
                this.updateArrowVisibility();
            }
        });
    }

    updateArrowVisibility() {
        const maxIndex = ASSETS_CONFIG.stations.length - 1;
        this.leftArrow.setAlpha(this.currentStation > 0 ? 1 : 0.25);
        this.rightArrow.setAlpha(this.currentStation < maxIndex ? 1 : 0.25);
    }

    takeSnapshot() {
        this.playSound('shutterClick');
        this.flashStatus(ASSETS_CONFIG.text.snapshotSavedStatus, '#00ffcc', 1200);

        const st = this.stations[this.currentStation];
        const w = st.cfg.width;
        const h = st.cfg.height;
        const bgW = st.bgW;
        const bgH = st.bgH;

        try {
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');

            const bgSource = st.bgSprite.texture.getSourceImage();
            const paintBgSource = st.rtBg.texture.getSourceImage();
            const baseSource = st.baseSprite.texture.getSourceImage();
            const paintOverSource = st.rtOver.texture.getSourceImage();
            const maskSource = st.maskCanvas || baseSource;

            if (this.isTransparentBg && this.isTargetPngVisible) {
                // Export ONLY the 220x155 Target PNG and its masked top-layer paint with a 100% transparent background
                exportCanvas.width = w;
                exportCanvas.height = h;
                ctx.drawImage(baseSource, 0, 0, w, h);
                ctx.drawImage(paintOverSource, 0, 0, w, h);
                ctx.globalCompositeOperation = 'destination-in';
                ctx.drawImage(maskSource, 0, 0, w, h);
            } else {
                // Export the full 300x250 Station Scene (Station Background + BG Paint + Target PNG + Target PNG Paint)
                exportCanvas.width = bgW;
                exportCanvas.height = bgH;

                if (!this.isTransparentBg && bgSource) {
                    ctx.drawImage(bgSource, 0, 0, bgW, bgH);
                }
                if (!this.isTransparentBg && paintBgSource) {
                    ctx.drawImage(paintBgSource, 0, 0, bgW, bgH);
                }
                if (this.isTargetPngVisible) {
                    const offsetX = 150 - w / 2;
                    const offsetY = 114 - h / 2;
                    ctx.drawImage(baseSource, offsetX, offsetY, w, h);
                    ctx.drawImage(paintOverSource, offsetX, offsetY, w, h);
                }
            }

            const dataUrl = exportCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `grimy-tag-spot-${this.currentStation + 1}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch (err) {
            console.warn('Snapshot download requires running on a web server or localhost.', err);
        }

        this.cameras.main.flash(140, 255, 255, 255);
    }

    // ========================================================================
    // CREDITS MODAL
    // ========================================================================
    buildCreditsModal() {
        this.creditsModal = this.add.container(0, 0).setDepth(100).setVisible(false);

        const overlay = this.add.rectangle(150, 125, 300, 250, 0x000000, 0.88).setInteractive();
        const panel = this.add.image(150, 125, 'creditsBg').setDisplaySize(260, 200);
        const modalLogo = this.add.image(150, 70, 'creditsLogo').setDisplaySize(140, 50);

        const closeBtn = this.add.image(265, 40, 'closeBtn')
            .setDisplaySize(24, 24)
            .setInteractive({ useHandCursor: true });

        closeBtn.on('pointerdown', (p, x, y, ev) => {
            ev.stopPropagation();
            this.closeCredits();
        });

        this.creditsModal.add([overlay, panel, modalLogo, closeBtn]);

        let startY = 120;
        ASSETS_CONFIG.credits.forEach(lineText => {
            let txt = this.add.text(150, startY, lineText, {
                fontFamily: ASSETS_CONFIG.fontFamily,
                fontSize: '11px',
                color: '#cccccc',
                fontStyle: 'bold',
                align: 'center'
            }).setOrigin(0.5);
            this.creditsModal.add(txt);
            startY += 24;
        });
    }

    openCredits() {
        this.stopDrawing();
        this.isModalOpen = true;
        this.creditsModal.setVisible(true).setAlpha(0);
        this.tweens.add({ targets: this.creditsModal, alpha: 1, duration: 150 });
    }

    closeCredits() {
        this.isModalOpen = false;
        this.creditsModal.setVisible(false);
    }

    // ========================================================================
    // AUDIO & SYNTH FALLBACKS
    // ========================================================================
    toggleMute() {
        this.isMuted = !this.isMuted;
        localStorage.setItem('grimy_tag_muted', this.isMuted);
        if (this.menuMuteBtn) {
            this.menuMuteBtn.setTexture(this.isMuted ? 'muteOn' : 'muteOff').setDisplaySize(20, 20);
        }
        if (this.isMuted) {
            this.stopSpraySound();
        } else {
            this.playSound('sizeClick');
        }
    }

    playSound(key) {
        if (this.isMuted) return;
        const audio = LOADED_HTML_AUDIO[key];
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } else {
            this.playSynthSfx(key);
        }
    }

    startSpraySound() {
        if (this.isMuted) return;
        const audio = LOADED_HTML_AUDIO['sprayLoop'];
        if (audio) {
            audio.loop = true;
            audio.currentTime = 0;
            audio.play().catch(() => {});
            return;
        }
        try {
            const ctx = this.sound.context;
            if (!ctx || this.sprayNoiseNode) return;
            const bufferSize = ctx.sampleRate * 0.5;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 3200;

            const gain = ctx.createGain();
            gain.gain.value = 0.06;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start();
            this.sprayNoiseNode = noise;
        } catch (e) {}
    }

    stopSpraySound() {
        const audio = LOADED_HTML_AUDIO['sprayLoop'];
        if (audio) {
            audio.pause();
            audio.currentTime = 0;
        }
        if (this.sprayNoiseNode) {
            try { this.sprayNoiseNode.stop(); } catch (e) {}
            this.sprayNoiseNode = null;
        }
    }

    playSynthSfx(key) {
        try {
            const ctx = this.sound.context;
            if (!ctx) return;
            const now = ctx.currentTime;

            if (key === 'canShake') {
                [0, 0.07].forEach(offset => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(900, now + offset);
                    osc.frequency.exponentialRampToValueAtTime(280, now + offset + 0.045);
                    gain.gain.setValueAtTime(0.14, now + offset);
                    gain.gain.linearRampToValueAtTime(0.01, now + offset + 0.045);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.045);
                });
            } else if (key === 'uploadErrorSfx') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(85, now + 0.22);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            } else if (key === 'uploadSuccessSfx' || key === 'uploadBgSuccessSfx') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(480, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.16);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            } else if (key === 'zoomInSfx' || key === 'zoomOutSfx' || key === 'layersSfx' || key === 'dripToggleSfx' || key === 'splatToggleSfx' || key === 'rainbowToggleSfx' || key === 'transToggleSfx' || key === 'targetToggleSfx' || key === 'menuOpenSfx' || key === 'menuCloseSfx') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                const f = key === 'zoomInSfx' ? 440 : (key === 'zoomOutSfx' ? 760 : 580);
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 1.45, now + 0.065);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.065);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.065);
            } else if (key === 'undoSfx') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.14);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (key === 'stickerSlapSfx') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(190, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            } else {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(640, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.05);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        } catch (e) {}
    }

    // ========================================================================
    // PLACEHOLDER GRAPHICS
    // ========================================================================
    createFallbackTextures() {
        const g = this.make.graphics({ x: 0, y: 0, add: false });
        const m = ASSETS_CONFIG.uiMetrics;
        const t = ASSETS_CONFIG.text;
        const font = ASSETS_CONFIG.fontFamily;
        const sz = m.topIconSize;
        const bSz = m.sideBtnSize;

        // Per-station 300x250 backgrounds:
        // Uses stCfg.bgKey if loaded, or copies images.defaultBackground if loaded, or generates a brick wall
        const hasDefaultBgImg = this.textures.exists('defaultBackground');
        const defaultBgSource = hasDefaultBgImg ? this.textures.get('defaultBackground').getSourceImage() : null;
        const wallBaseColors = [0x141416, 0x161418, 0x121616, 0x181512, 0x141619];

        ASSETS_CONFIG.stations.forEach((stCfg, idx) => {
            const bgW = stCfg.bgWidth || 300;
            const bgH = stCfg.bgHeight || 250;
            if (!this.textures.exists(stCfg.bgKey)) {
                if (defaultBgSource) {
                    const canvas = this.textures.createCanvas(stCfg.bgKey, bgW, bgH);
                    canvas.context.drawImage(defaultBgSource, 0, 0, bgW, bgH);
                    canvas.refresh();
                } else {
                    g.clear();
                    g.fillStyle(wallBaseColors[idx % wallBaseColors.length], 1);
                    g.fillRect(0, 0, bgW, bgH);
                    g.lineStyle(1, 0x222226, 1);
                    for (let y = 32; y < 200; y += 16) {
                        g.lineBetween(0, y, bgW, y);
                        const offset = (y / 16) % 2 === 0 ? 0 : 16;
                        for (let x = offset; x < bgW; x += 32) {
                            g.lineBetween(x, y, x, y + 16);
                        }
                    }
                    g.generateTexture(stCfg.bgKey, bgW, bgH);
                }
            }
        });

        const fallbackColors = [0xdddddd, 0x2b4c3f, 0xe8e4d9, 0x3a2e4c, 0x4c362b];
        ASSETS_CONFIG.stations.forEach((stCfg, idx) => {
            if (!this.textures.exists(stCfg.key)) {
                g.clear();
                const fillCol = fallbackColors[idx % fallbackColors.length];
                g.fillStyle(fillCol, 1);
                g.lineStyle(4, 0x555555, 1);
                g.fillRoundedRect(18, 16, stCfg.width - 36, stCfg.height - 32, 10);
                g.strokeRoundedRect(18, 16, stCfg.width - 36, stCfg.height - 32, 10);
                g.generateTexture(stCfg.key, stCfg.width, stCfg.height);
            }
        });

        const stickerPalette = ['#ff0055', '#00ffcc', '#ffdd00', '#9922ff', '#ff7700', '#00dd44'];
        ASSETS_CONFIG.stickers.forEach((sk, idx) => {
            if (!this.textures.exists(sk.key)) {
                const canvas = this.textures.createCanvas(sk.key, sk.width, sk.height);
                const ctx = canvas.context;
                ctx.fillStyle = stickerPalette[idx % stickerPalette.length];
                ctx.fillRect(2, 2, sk.width - 4, sk.height - 4);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(2, 2, sk.width - 4, sk.height - 4);
                ctx.fillStyle = '#080808';
                ctx.font = `900 9px ${font}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`TAG ${idx + 1}`, sk.width / 2, sk.height / 2);
                canvas.refresh();
            }
        });

        const makeBoxBtnTex = (key, width, height, label, borderColor, textColor = borderColor, fontSize = 8) => {
            if (this.textures.exists(key)) return;
            const canvas = this.textures.createCanvas(key, width, height);
            const ctx = canvas.context;
            ctx.fillStyle = '#222222';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = borderColor;
            ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
            ctx.fillStyle = textColor;
            ctx.font = `900 ${fontSize}px ${font}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, width / 2, height / 2 + 0.5);
            canvas.refresh();
        };

        // Side Column Buttons
        makeBoxBtnTex('splatBtn', bSz, bSz, t.splatLabel, '#ff7700', '#ff7700', 7);
        makeBoxBtnTex('stickerBtn', bSz, bSz, t.stickerLabel, '#ff33aa', '#ff33aa', 10);
        makeBoxBtnTex('zoomOutBtn', bSz, bSz, t.zoomOutLabel, '#00ffcc', '#00ffcc', 12);
        makeBoxBtnTex('rainbowBtn', bSz, bSz, t.rainbowLabel, '#ff33aa', '#ffdd00', 7);

        makeBoxBtnTex('layersBtn', bSz, bSz, t.layersLabel, '#00ffcc', '#00ffcc', 7);
        makeBoxBtnTex('undoBtn', bSz, bSz, t.undoLabel, '#ffcc00', '#ffcc00', 11);
        makeBoxBtnTex('zoomInBtn', bSz, bSz, t.zoomInLabel, '#00ffcc', '#00ffcc', 12);
        makeBoxBtnTex('dripBtn', bSz, bSz, t.dripLabel, '#00dd44', '#00dd44', 7);

        // Hamburger Menu Button & Menu Action Buttons
        makeBoxBtnTex('menuBtn', sz, sz, t.menuBtnLabel, '#00ffcc', '#ffffff', 12);
        makeBoxBtnTex('transBgOn', m.toggleBtnWidth, m.toggleBtnHeight, t.toggleOnLabel, '#00ffcc', '#00ffcc', 9);
        makeBoxBtnTex('transBgOff', m.toggleBtnWidth, m.toggleBtnHeight, t.toggleOffLabel, '#ff0055', '#ff99aa', 9);
        makeBoxBtnTex('targetPngOn', m.toggleBtnWidth, m.toggleBtnHeight, t.toggleOnLabel, '#00ffcc', '#00ffcc', 9);
        makeBoxBtnTex('targetPngOff', m.toggleBtnWidth, m.toggleBtnHeight, t.toggleOffLabel, '#ff0055', '#ff99aa', 9);
        makeBoxBtnTex('uploadBtn', m.uploadBtnWidth, m.uploadBtnHeight, t.uploadBtnLabel, '#ffdd00', '#ffdd00', 8);
        makeBoxBtnTex('uploadBgBtn', m.uploadBtnWidth, m.uploadBtnHeight, t.uploadBgBtnLabel, '#00ffcc', '#00ffcc', 8);

        // Fallback for "OPTIONS & TOOLS" Menu Title Image (160x22)
        if (!this.textures.exists('menuTitleImg')) {
            const canvas = this.textures.createCanvas('menuTitleImg', m.menuTitleWidth, m.menuTitleHeight);
            const ctx = canvas.context;
            ctx.clearRect(0, 0, m.menuTitleWidth, m.menuTitleHeight);
            ctx.fillStyle = '#00ffcc';
            ctx.font = `900 13px ${font}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.menuTitle, m.menuTitleWidth / 2, m.menuTitleHeight / 2);
            canvas.refresh();
        }

        if (!this.textures.exists('menuBg')) {
            g.clear();
            g.fillStyle(0x111115, 1);
            g.lineStyle(2, 0x00ffcc, 1);
            g.fillRoundedRect(0, 0, m.menuModalWidth, m.menuModalHeight, 8);
            g.strokeRoundedRect(0, 0, m.menuModalWidth, m.menuModalHeight, 8);
            g.generateTexture('menuBg', m.menuModalWidth, m.menuModalHeight);
        }

        if (!this.textures.exists('stickerTrayBg')) {
            g.clear();
            g.fillStyle(0x0c0c10, 0.96);
            g.lineStyle(2, 0xff33aa, 1);
            g.fillRoundedRect(0, 0, m.trayWidth, m.trayHeight, 6);
            g.strokeRoundedRect(0, 0, m.trayWidth, m.trayHeight, 6);
            g.generateTexture('stickerTrayBg', m.trayWidth, m.trayHeight);
        }

        SPRAY_COLORS.forEach((col) => {
            if (!this.textures.exists(col.key)) {
                g.clear();
                g.fillStyle(col.hex, 1);
                g.lineStyle(1.5, 0x444444, 1);
                g.fillRoundedRect(1, 1, m.colorBtnWidth - 2, m.colorBtnHeight - 2, 4);
                g.strokeRoundedRect(1, 1, m.colorBtnWidth - 2, m.colorBtnHeight - 2, 4);
                g.generateTexture(col.key, m.colorBtnWidth, m.colorBtnHeight);
            }
        });

        // 4 Brush Size Icon Fallbacks (XS, S, M, L)
        const dotRadii = [1.2, 2.3, 3.8, 5.5];
        BRUSH_SIZES.forEach((szItem, idx) => {
            if (!this.textures.exists(szItem.key)) {
                g.clear();
                g.fillStyle(0x1f1f1f, 1);
                g.lineStyle(1, 0x555555, 1);
                g.fillRoundedRect(0, 0, m.sizeBtnWidth, m.sizeBtnHeight, 3);
                g.strokeRoundedRect(0, 0, m.sizeBtnWidth, m.sizeBtnHeight, 3);
                g.fillStyle(0xffffff, 1);
                g.fillCircle(m.sizeBtnWidth / 2, m.sizeBtnHeight / 2, dotRadii[idx] || 3);
                g.generateTexture(szItem.key, m.sizeBtnWidth, m.sizeBtnHeight);
            }
        });

        // 3 Compact Visual Icon Fallbacks for Soft, Hard, and Spray Styles (22x16)
        BRUSH_STYLES.forEach((st) => {
            if (!this.textures.exists(st.key)) {
                const w = m.styleBtnWidth;
                const h = m.styleBtnHeight;
                const cx = w / 2;
                const cy = h / 2;
                const canvas = this.textures.createCanvas(st.key, w, h);
                const ctx = canvas.context;

                ctx.fillStyle = '#1f1f1f';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#555555';
                ctx.strokeRect(0.5, 0.5, w - 1, h - 1);

                if (st.id === 'soft') {
                    const grad = ctx.createRadialGradient(cx, cy, 0.5, cx, cy, 6.5);
                    grad.addColorStop(0, 'rgba(255, 255, 204, 1)');
                    grad.addColorStop(0.5, 'rgba(0, 255, 204, 0.55)');
                    grad.addColorStop(1, 'rgba(0, 255, 204, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (st.id === 'hard') {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#00ffcc';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    const dots = [
                        [-5, -3], [5, -3], [-6, 2], [6, 2],
                        [-3, 4], [3, 4], [0, -5], [-4, 0], [4, 0]
                    ];
                    ctx.fillStyle = '#ffffff';
                    dots.forEach(([dx, dy]) => {
                        ctx.fillRect(cx + dx - 0.5, cy + dy - 0.5, 1.3, 1.3);
                    });
                }
                canvas.refresh();
            }
        });

        makeBoxBtnTex('eraserBtn', m.eraserBtnWidth, m.eraserBtnHeight, t.eraserLabel, '#ff99aa', '#ff99aa', 8);
        makeBoxBtnTex('clearBtn', m.clearBtnWidth, m.clearBtnHeight, t.clearLabel, '#ff0055', '#ff0055', 8);

        if (!this.textures.exists('topBarBg')) {
            g.clear();
            g.fillStyle(0x050505, 0.94);
            g.fillRect(0, 0, 300, 32);
            g.lineStyle(1, 0x2a2a2a, 1);
            g.lineBetween(0, 31, 300, 31);
            g.generateTexture('topBarBg', 300, 32);
        }

        if (!this.textures.exists('bottomBarBg')) {
            g.clear();
            g.fillStyle(0x080808, 0.96);
            g.fillRect(0, 0, 300, 54);
            g.lineStyle(1, 0x2a2a2a, 1);
            g.lineBetween(0, 0, 300, 0);
            g.generateTexture('bottomBarBg', 300, 54);
        }

        if (!this.textures.exists('arrowLeft')) {
            g.clear();
            g.fillStyle(0x111111, 0.85);
            g.lineStyle(1.5, 0x00ffcc, 1);
            g.fillRoundedRect(0, 0, m.arrowWidth, m.arrowHeight, 4);
            g.strokeRoundedRect(0, 0, m.arrowWidth, m.arrowHeight, 4);
            g.fillStyle(0x00ffcc, 1);
            g.fillTriangle(15, 10, 15, m.arrowHeight - 10, 5, m.arrowHeight / 2);
            g.generateTexture('arrowLeft', m.arrowWidth, m.arrowHeight);
        }

        if (!this.textures.exists('arrowRight')) {
            g.clear();
            g.fillStyle(0x111111, 0.85);
            g.lineStyle(1.5, 0x00ffcc, 1);
            g.fillRoundedRect(0, 0, m.arrowWidth, m.arrowHeight, 4);
            g.strokeRoundedRect(0, 0, m.arrowWidth, m.arrowHeight, 4);
            g.fillStyle(0x00ffcc, 1);
            g.fillTriangle(5, 10, 5, m.arrowHeight - 10, 15, m.arrowHeight / 2);
            g.generateTexture('arrowRight', m.arrowWidth, m.arrowHeight);
        }

        if (!this.textures.exists('camIcon')) {
            g.clear();
            g.fillStyle(0x222222, 1);
            g.lineStyle(1.5, 0xffffff, 1);
            g.fillRoundedRect(0, 0, sz, sz, 4);
            g.strokeRoundedRect(0, 0, sz, sz, 4);
            g.strokeCircle(sz / 2, sz / 2 + 1, 4);
            g.fillRect(sz / 2 - 3, 3, 6, 2);
            g.generateTexture('camIcon', sz, sz);
        }

        if (!this.textures.exists('creditsBg')) {
            g.clear();
            g.fillStyle(0x111111, 1);
            g.lineStyle(2, 0x333333, 1);
            g.fillRoundedRect(0, 0, 260, 200, 8);
            g.strokeRoundedRect(0, 0, 260, 200, 8);
            g.generateTexture('creditsBg', 260, 200);
        }

        if (!this.textures.exists('closeBtn')) {
            g.clear();
            g.fillStyle(0xff0055, 1);
            g.fillCircle(12, 12, 12);
            g.lineStyle(2, 0xffffff, 1);
            g.lineBetween(8, 8, 16, 16);
            g.lineBetween(16, 8, 8, 16);
            g.generateTexture('closeBtn', 24, 24);
        }

        if (!this.textures.exists('logo')) {
            g.clear();
            g.fillStyle(0xff0055, 1);
            g.fillRoundedRect(0, 0, 50, 16, 4);
            g.generateTexture('logo', 50, 16);
        }

        if (!this.textures.exists('creditsLogo')) {
            g.clear();
            g.fillStyle(0xff0055, 1);
            g.fillRoundedRect(0, 0, 140, 50, 8);
            g.generateTexture('creditsLogo', 140, 50);
        }

        if (!this.textures.exists('creditsBtn')) {
            g.clear();
            g.fillStyle(0x333333, 1);
            g.lineStyle(1, 0x00ffcc, 1);
            g.fillRoundedRect(0, 0, 44, 16, 4);
            g.strokeRoundedRect(0, 0, 44, 16, 4);
            g.generateTexture('creditsBtn', 44, 16);
        }

        if (!this.textures.exists('muteOff')) {
            g.clear();
            g.fillStyle(0x222222, 1);
            g.lineStyle(1.5, 0x00ffcc, 1);
            g.fillRoundedRect(0, 0, 20, 20, 4);
            g.strokeRoundedRect(0, 0, 20, 20, 4);
            g.fillStyle(0x00ffcc, 1);
            g.fillTriangle(4, 10, 11, 4, 11, 16);
            g.lineBetween(14, 6, 16, 14);
            g.generateTexture('muteOff', 20, 20);
        }

        if (!this.textures.exists('muteOn')) {
            g.clear();
            g.fillStyle(0x222222, 1);
            g.lineStyle(1.5, 0xff0055, 1);
            g.fillRoundedRect(0, 0, 20, 20, 4);
            g.strokeRoundedRect(0, 0, 20, 20, 4);
            g.fillStyle(0x777777, 1);
            g.fillTriangle(4, 10, 11, 4, 11, 16);
            g.lineStyle(2, 0xff0055, 1);
            g.lineBetween(13, 6, 18, 14);
            g.lineBetween(18, 6, 13, 14);
            g.generateTexture('muteOn', 20, 20);
        }

        g.destroy();
    }
}

// ============================================================================
// 4. BOOTSTRAP GAME
// ============================================================================
preloadLocalAssets(() => {
    const config = {
        type: Phaser.CANVAS,
        width: 300,
        height: 250,
        parent: 'game-container',
        backgroundColor: '#080808',
        preserveDrawingBuffer: true,
        scene: [GraffitiGame]
    };
    new Phaser.Game(config);
});
</script>
